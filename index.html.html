<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --sep:rgba(60,60,67,.20);
    --label:#000000; --label2:rgba(60,60,67,.60); --label3:rgba(60,60,67,.30);
    --blue:#007AFF; --green:#34C759; --red:#FF3B30; --fill:rgba(120,120,128,.12);
    --blur:rgba(242,242,247,.72);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --card:#1C1C1E; --sep:rgba(84,84,88,.65);
      --label:#FFFFFF; --label2:rgba(235,235,245,.60); --label3:rgba(235,235,245,.30);
      --blue:#0A84FF; --green:#30D158; --red:#FF453A; --fill:rgba(120,120,128,.24);
      --blur:rgba(0,0,0,.70);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--label);
    font:400 17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 calc(40px + env(safe-area-inset-bottom));
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid transparent;transition:border-color .2s;
    padding-top:env(safe-area-inset-top);
  }
  header.stuck{border-color:var(--sep)}
  .bar{display:flex;align-items:center;justify-content:space-between;height:44px}
  .bar button{
    background:none;border:0;color:var(--blue);font:400 17px/1 -apple-system,system-ui;padding:6px 0;cursor:pointer
  }
  .bar button.done{font-weight:600}
  .hero{display:flex;align-items:center;gap:16px;padding:2px 0 14px}
  .ring{width:64px;height:64px;flex:0 0 64px;position:relative}
  .ring svg{transform:rotate(-90deg);display:block}
  .ring .track{stroke:var(--fill)}
  .ring .val{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .45s cubic-bezier(.22,1,.36,1),stroke .3s}
  body.complete .ring .val{stroke:var(--green)}
  .ring b{
    position:absolute;inset:0;display:grid;place-items:center;
    font:600 15px/1 -apple-system,system-ui;letter-spacing:-.3px;font-variant-numeric:tabular-nums
  }
  h1{margin:0;font:700 34px/1.05 -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui;letter-spacing:-.9px}
  .sub{margin:4px 0 0;color:var(--label2);font-size:15px}
  body.complete .sub{color:var(--green);font-weight:600}

  /* ---------- Groups ---------- */
  .ghead{
    font:400 13px/1 -apple-system,system-ui;letter-spacing:.4px;text-transform:uppercase;
    color:var(--label2);padding:26px 16px 7px
  }
  .group{background:var(--card);border-radius:12px;overflow:hidden}
  .row{
    display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:46px;
    position:relative;cursor:pointer;user-select:none;
  }
  .row+.row:before{content:"";position:absolute;left:52px;right:0;top:0;height:.5px;background:var(--sep)}
  .row:active{background:var(--fill)}
  .box{
    flex:0 0 24px;width:24px;height:24px;border-radius:50%;
    border:1.6px solid var(--label3);display:grid;place-items:center;
    transition:background .18s,border-color .18s,transform .18s cubic-bezier(.34,1.56,.64,1)
  }
  .box svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .22s ease .04s}
  .row.on .box{background:var(--blue);border-color:var(--blue)}
  .row.on .box svg{stroke-dashoffset:0}
  .row.on .txt{color:var(--label2)}
  .txt{flex:1;letter-spacing:-.4px;transition:color .2s}
  .tag{font-size:13px;color:var(--label3);letter-spacing:-.2px}

  /* Edit mode */
  .del{
    flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--red);
    display:none;place-items:center;margin-right:-2px
  }
  .del:before{content:"";width:11px;height:1.8px;background:#fff;border-radius:1px}
  body.editing .del{display:grid}
  body.editing .box{display:none}
  body.editing .row+.row:before{left:50px}
  .add{display:none;align-items:center;gap:12px;padding:11px 16px;min-height:46px;color:var(--blue);cursor:pointer}
  body.editing .add{display:flex}
  .add .plus{flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--green);display:grid;place-items:center;position:relative}
  .add .plus:before,.add .plus:after{content:"";position:absolute;background:#fff;border-radius:1px}
  .add .plus:before{width:11px;height:1.8px}.add .plus:after{width:1.8px;height:11px}

  /* ---------- Footer actions ---------- */
  .actions{margin-top:32px;background:var(--card);border-radius:12px;overflow:hidden}
  .actions button{
    width:100%;background:none;border:0;padding:12px 16px;min-height:46px;
    font:400 17px/1 -apple-system,system-ui;color:var(--blue);cursor:pointer;text-align:center;letter-spacing:-.4px
  }
  .actions button:active{background:var(--fill)}
  .actions button+button{border-top:.5px solid var(--sep)}
  .actions .danger{color:var(--red)}
  .note{color:var(--label3);font-size:12.5px;text-align:center;padding:14px 24px 0;line-height:1.45}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:rgba(28,28,30,.92);color:#fff;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    padding:11px 20px;border-radius:22px;font-size:15px;font-weight:500;letter-spacing:-.2px;
    opacity:0;pointer-events:none;transition:.28s cubic-bezier(.22,1,.36,1);z-index:50
  }
  @media (prefers-color-scheme: dark){#toast{background:rgba(58,58,60,.92)}}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <div class="actions">
    <button id="uncheck">Uncheck all</button>

  </div>
  <p class="note">Select an item to mark it packed. Progress is stored on this device and resets automatically each day.</p>

<div id="toast"></div>

<script>
const DEFAULTS = [
  {t:"Gym Bag Essentials", i:[
    "Change of clothing",
    "Clean undergarments",
    "Clean socks",
    "Change of footwear",
    "Shower sandals",
    "Water bottle",
    "Post-workout smoothie",
    "AirPods"
  ]}
];

/* ---------- storage: artifact store → localStorage → memory ---------- */
const KEY="gymready.v4"; let mem=null;
async function load(){
  try{ if(window.storage){const r=await window.storage.get(KEY); return r?JSON.parse(r.value):null;} }catch(e){}
  try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){}
  return mem;
}
async function save(){
  const s=JSON.stringify(state);
  try{ if(window.storage){await window.storage.set(KEY,s); return;} }catch(e){}
  try{ localStorage.setItem(KEY,s); return; }catch(e){}
  mem=state;
}

let state={sections:null,done:{},day:null};
const $=s=>document.querySelector(s);
const today=()=>new Date().toDateString();
const idOf=(s,t)=>s+"|"+t;

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),1600);}
function tap(){ if(navigator.vibrate) navigator.vibrate(8); }

function render(){
  const l=$("#list"); l.innerHTML="";
  state.sections.forEach((sec,si)=>{
    const h=document.createElement("div"); h.className="ghead"; h.textContent=sec.t; l.appendChild(h);
    const g=document.createElement("div"); g.className="group";
    sec.i.forEach((item,ii)=>{
      const on=!!state.done[idOf(sec.t,item)];
      const r=document.createElement("div"); r.className="row"+(on?" on":"");
      r.innerHTML=`<div class="del" data-del="${si}.${ii}"></div>
        <div class="box"><svg viewBox="0 0 24 24"><path d="M5 13l4.5 4.5L19 7"/></svg></div>
        <div class="txt">${item.replace(/</g,"&lt;")}</div>`;
      r.addEventListener("click",e=>{
        if(document.body.classList.contains("editing")){
          if(e.target.closest(".del")){ sec.i.splice(ii,1); delete state.done[idOf(sec.t,item)]; save(); render(); tap(); }
          return;
        }
        state.done[idOf(sec.t,item)] = !on; save(); render(); tap();
      });
      g.appendChild(r);
    });
    const a=document.createElement("div"); a.className="add";
    a.innerHTML=`<div class="plus"></div><div class="txt">Add item</div>`;
    a.addEventListener("click",()=>{
      const v=prompt("New item for “"+sec.t+"”");
      if(v&&v.trim()){ sec.i.push(v.trim()); save(); render(); }
    });
    g.appendChild(a);
    l.appendChild(g);
  });
  meter();
}

function meter(){
  const all=state.sections.flatMap(s=>s.i.map(i=>idOf(s.t,i)));
  const n=all.filter(k=>state.done[k]).length, T=all.length||1;
  const p=Math.round(n/T*100), C=2*Math.PI*27;
  $("#arc").style.strokeDashoffset = C-(C*n/T);
  $("#pct").textContent = p+"%";
  const done = n===T && T>0;
  document.body.classList.toggle("complete",done);
  $("#sub").textContent = done ? "All items packed. You're ready."
    : n===0 ? "No items packed" : `${T-n} item${T-n>1?"s":""} remaining`;
}

$("#edit").addEventListener("click",e=>{
  const on=document.body.classList.toggle("editing");
  e.target.textContent = on?"Done":"Edit"; e.target.classList.toggle("done",on);
});
$("#reset").addEventListener("click",()=>{ state.done={}; save(); render(); toast("Checklist reset"); });
$("#uncheck").addEventListener("click",()=>{ state.done={}; save(); render(); toast("Checklist reset"); });
$("#restore").addEventListener("click",()=>{
  if(confirm("Restore the default list? Your custom items will be removed.")){
    state.sections=JSON.parse(JSON.stringify(DEFAULTS)); state.done={}; save(); render(); toast("Default list restored");
  }
});
addEventListener("scroll",()=>document.querySelector("header").classList.toggle("stuck",scrollY>4),{passive:true});

(async function init(){
  const saved = await load();
  state = saved || {sections:null,done:{},day:null};
  if(!Array.isArray(state.sections) || !state.sections.length) state.sections=JSON.parse(JSON.stringify(DEFAULTS));
  if(state.day!==today()){ state.done={}; state.day=today(); save(); }
  render();
})();
</script>
</body>
