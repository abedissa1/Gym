*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#0B0B0E;--card:#15151D;--card2:#1B1B25;--ink:#0E0E13;--line:#2A2A38;
 /* accent = app icon blue */
 --purple:#5E93C4;--purple-d:#3E6F9E;--blue-deep:#2F5C86;
 --teal:#5E93C4;--amber:#F0A868;--green:#34D97B;--red:#FF4D4D;--rest:#EA4A50;
 --w:#F4F4F8;--dim:#A6A6B4;--faint:#7C7C8C;--ghost:#4A4A57;
}
#bgfill{position:fixed;inset:0;background:#0B0B0E;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}
html{background:#0B0B0E !important;min-height:100%;color-scheme:dark}
body{background:#0B0B0E !important;min-height:100vh;min-height:100dvh;color:var(--w);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 padding-bottom:96px;line-height:1.45;-webkit-font-smoothing:antialiased}
.tab{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(11,11,14,.95);backdrop-filter:blur(16px);
 border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.htop{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px;gap:10px}
.htop h1{white-space:nowrap}
.brand{flex-shrink:0}
.hbtns{display:flex;gap:7px;align-items:center;flex-shrink:0}
/* iOS-style switch for keep-screen-on */
.sw{position:relative;width:50px;height:30px;border-radius:15px;border:none;padding:0;
 background:#3A3A45;transition:background .22s ease;flex-shrink:0;cursor:pointer}
.sw .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
 background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .22s cubic-bezier(.3,.7,0,1)}
.sw[aria-checked="true"]{background:#34C759}
.sw[aria-checked="true"] .knob{transform:translateX(20px)}
.sw:active .knob{width:27px}
/* circular info button, same height as the switch */
.ibtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);
 background:none;color:var(--dim);font-size:17px;font-weight:400;line-height:1;padding:0;
 font-family:Georgia,'Times New Roman',serif;cursor:pointer;flex-shrink:0}
.ibtn:active{border-color:var(--purple);color:var(--purple)}
.ibtn:active{border-color:var(--purple);color:var(--purple)}

.htop h1{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
 font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--w);line-height:1.15}
.brand{display:flex;align-items:center;gap:9px;margin-left:10px}
.mark{height:52px;width:auto;display:block}
.htop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px 12px}
.hslot{display:flex;align-items:center;min-height:52px}
.hslot.left{justify-content:flex-start}
.hslot.mid{justify-content:center}
.hslot.right{justify-content:flex-end}
.hslot > *{align-self:center}
.htop .date{font-size:13px;color:var(--faint)}
.hslot.right{gap:9px}
.wkwrap{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.wksel{appearance:none;-webkit-appearance:none;background:var(--card2);color:var(--purple);
 border:1.5px solid var(--purple-d);border-radius:11px;padding:7px 26px 7px 11px;
 font-size:14px;font-weight:800;letter-spacing:.04em;font-family:inherit;line-height:1.1;cursor:pointer}
.wkwrap:after{content:'';position:absolute;right:10px;top:13px;width:0;height:0;pointer-events:none;
 border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--purple)}
.wksel:focus{outline:none;border-color:var(--purple)}
.wkph{font-size:10.5px;letter-spacing:.09em;font-weight:700;color:var(--faint);padding-left:2px;text-transform:uppercase}
.wkph.dl{color:var(--amber)}
.phase{margin-top:10px;padding:10px 12px;border-radius:11px;background:rgba(94,147,196,.10);
 border:1px solid rgba(94,147,196,.30);font-size:12.5px;color:var(--dim);line-height:1.45}
.phase b{color:var(--w)}
.phase.dl{background:rgba(240,168,104,.10);border-color:rgba(240,168,104,.32)}
.phase.q{cursor:pointer}
.phase.q:after{content:'  Tap for the block plan';color:var(--purple);font-weight:700}
.phase.q:active{border-color:var(--purple)}
.nxt{margin:11px 17px 0;padding:9px 12px;border-radius:10px;background:rgba(94,147,196,.09);
 border:1px solid rgba(94,147,196,.26);font-size:12.5px;color:var(--dim);line-height:1.4}
.nxt b{color:var(--purple)}
.nxt.hold b{color:var(--amber)}
.nxt.dl b{color:var(--amber)}
.wkcard{margin:14px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px}
.wkcard h5{font-size:14px;font-weight:800;letter-spacing:-.01em;margin-bottom:3px;color:var(--w)}
.wkcard .sub{font-size:12px;color:var(--faint);margin-bottom:11px}
.wkrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.wkrow .en{color:var(--dim);flex:1;min-width:0}
.wkrow .ev{font-weight:700;white-space:nowrap;color:var(--green)}
.wkrow .ev.hold{color:var(--amber)}
.wkrow .ev.none{color:var(--faint);font-weight:600}
.days{display:flex;gap:8px;padding:8px 16px 14px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;
 padding:12px 0;font-size:15px;font-weight:800;color:var(--dim);white-space:nowrap;
 letter-spacing:.06em;text-align:center}

.day.on{background:var(--purple);border-color:var(--purple);color:#08182A}
.day.on .d{color:rgba(8,24,42,.72)}

/* ---------- timer ---------- */
.timer{background:var(--ink);border-bottom:1px solid var(--line);padding:12px 16px;
 display:flex;align-items:center;gap:12px;transition:background .3s}
.timer.run{background:linear-gradient(90deg,rgba(94,147,196,.20),rgba(14,14,19,.9))}
.timer.done{background:rgba(52,217,123,.16)}
.timer.warn{background:linear-gradient(90deg,rgba(234,74,80,.22),rgba(14,14,19,.9))}
.timer.warn .tdisp{color:var(--rest)}
.timer.flash{animation:tflash .5s steps(1,end) infinite}
@keyframes tflash{
  0%  {background:rgba(234,74,80,.12)}
  50% {background:rgba(234,74,80,.42)}
}
.timer.go{background:rgba(52,217,123,.22);animation:none}
.timer.go .tdisp{color:var(--green)}
@media(prefers-reduced-motion:reduce){.timer.flash{animation:none;background:rgba(234,74,80,.3)}}
.tdisp.idle{color:var(--ghost)}
.tdisp{font-size:64px;font-weight:800;letter-spacing:-.02em;line-height:1;
 font-variant-numeric:tabular-nums;flex:1;text-align:center;white-space:nowrap;overflow:visible}
.timer.done .tdisp{color:var(--green)}
.timer.warn .tdisp{color:var(--red)}
.tmeta{display:none !important}
.tmeta .l1{display:none}
.tmeta .l2{font-size:13px;color:var(--faint);line-height:1.3;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tbtns{display:flex;gap:6px;flex-shrink:0}
.tb{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:9px;
 padding:9px 11px;font-size:12px;font-weight:600;min-width:42px}
.tb.p{background:var(--purple);border-color:var(--purple);color:#08182A}
.tb:active{opacity:.65}
.tbar{height:3px;background:var(--line)}
.tbar > i{display:block;height:100%;background:var(--rest);width:0%;transition:width .3s linear}
.timer.done ~ .tbar > i{background:var(--green)}
.timer.go ~ .tbar > i{background:var(--green)}

/* ---------- session meta ---------- */
.meta{margin:6px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.meta .obj{font-size:18px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.mrow{display:flex;gap:10px;margin-top:14px}
.mi{flex:1;min-width:0;font-size:12.5px;color:var(--faint);text-align:center}
.mi b{display:block;color:var(--w);font-size:16px;font-weight:700;margin-top:4px}

/* ---------- collapsible ---------- */
.fold{margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fold > summary{padding:16px 17px;font-size:17px;font-weight:700;display:flex;align-items:center;
 gap:10px;list-style:none;cursor:pointer}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary .ch{margin-left:auto;color:var(--faint);font-size:12px;transition:.2s}
.fold[open] > summary .ch{transform:rotate(180deg)}
.fold .body{padding:0 16px 15px}
.step{display:flex;gap:11px;padding:8px 0;font-size:14.5px;color:var(--dim);line-height:1.45}
.step .n{color:var(--purple);font-weight:700;font-size:11px;flex-shrink:0;padding-top:2px}

/* ---------- exercise ---------- */
.ex{margin:6px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden}
.ex.done{border-color:rgba(93,211,158,.45)}
.ex.focusme{border-color:var(--purple);box-shadow:0 0 0 3px rgba(94,147,196,.24)}
.exh{padding:15px 16px 12px;border-left:3px solid var(--acc)}
.r1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exh h3{font-size:21px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--ghost);flex-shrink:0;
 display:flex;align-items:center;justify-content:center;font-size:16px;color:transparent;
 background:transparent;cursor:pointer;padding:0;transition:.15s;-webkit-appearance:none;
 position:relative}
.tick::after{content:"";position:absolute;inset:-12px}  /* bigger touch target */
.tick:active{transform:scale(.88);border-color:var(--acc)}
.ex.done .tick{background:var(--green);border-color:var(--green);color:#04220F}
.mus{font-size:13.5px;color:var(--faint);margin-top:6px}
.mus b{color:var(--acc);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;
 font-size:13px;color:var(--dim);font-weight:600}
.chip.a{color:var(--purple);border-color:rgba(167,139,250,.3)}
.last{font-size:13px;color:var(--faint);margin-top:11px;line-height:1.45}
.last b{color:var(--dim);font-weight:600}

.sets{padding:2px 16px 12px}
.srow{display:flex;align-items:center;gap:7px;margin-top:8px}
.sn{width:34px;font-size:13px;color:var(--faint);font-weight:800;flex-shrink:0}
.sn.top{color:var(--purple)}
input{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--w);
 font-size:17px;font-weight:600;padding:11px 6px;width:100%;text-align:center;
 font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:focus{outline:none;border-color:var(--purple)}
input.filled{border-color:#2E4A6E;background:#16233A}
.colhead{display:flex;align-items:center;gap:7px;margin:2px 0 6px}
.colhead div{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--faint);font-weight:800;text-align:center}
.colhead .h-sn{width:34px;flex-shrink:0}
.colhead .h-w,.colhead .h-r{flex:1}
.colhead .h-rest{min-width:56px;flex-shrink:0}
.rest{background:var(--card2);border:1px solid var(--line);color:var(--rest);
 border-radius:10px;padding:11px 10px;font-size:15px;font-weight:800;flex-shrink:0;min-width:56px}
.rest:active{background:var(--rest);color:#2A0508;border-color:var(--rest)}
.setctl{display:flex;align-items:center;gap:7px;margin-top:12px;padding-top:12px;
 border-top:1px dashed var(--line);position:relative}
.sc-sn{width:34px;flex-shrink:0}
.sc-col{flex:1;display:flex;justify-content:center}
.sc-mid{width:0;margin:0 -3.5px;overflow:visible;display:flex;justify-content:center}
.sc-mid .sccount{position:relative;white-space:nowrap}
.sc-rest{min-width:56px;flex-shrink:0}
.scirc{position:relative;width:38px;height:38px;border-radius:50%;background:var(--card2);
 border:1px solid var(--line);color:var(--w);font-size:20px;font-weight:700;line-height:1;
 padding:0;display:flex;align-items:center;justify-content:center}
.scirc:active{background:var(--purple);color:#08182A;border-color:var(--purple)}
.scirc[disabled]{opacity:.28}
/* active states: green when sets added, red when removed */
.scirc.on-add{background:#34C759;border-color:#34C759;color:#04220F}
.scirc.on-rem{background:var(--rest);border-color:var(--rest);color:#2A0508}
.scirc.on-add,.scirc.on-rem{font-size:17px;font-weight:800}
.sccount{font-size:12.5px;color:var(--faint);font-weight:700;white-space:nowrap;text-align:center}
.sn.xtra{color:var(--amber)}

.rule{display:flex;gap:9px;padding:12px 17px 0;font-size:13px;color:var(--faint);line-height:1.45}
.rule .i{color:var(--purple);flex-shrink:0}
.flag{margin:11px 17px 0;background:rgba(52,217,123,.12);border:1px solid rgba(52,217,123,.34);
 border-radius:11px;padding:11px 13px;font-size:13px;color:var(--green);font-weight:700;display:none}
.flag.on{display:block}
details.coach{margin:11px 16px 14px;border-top:1px solid var(--line);padding-top:11px}
details.coach summary{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
 font-weight:800;list-style:none;cursor:pointer}
details.coach summary::-webkit-details-marker{display:none}
details.coach summary::after{content:" +";color:var(--purple)}
details.coach[open] summary::after{content:" −"}
.cn{font-size:14.5px;color:var(--dim);line-height:1.5;margin-top:11px}
.mf{display:flex;gap:9px;margin-top:10px}
.mf > div{flex:1;background:var(--ink);border-radius:10px;padding:10px 11px}
.mf .t{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:800}
.mf .miss .t{color:var(--rest)}.mf .fix .t{color:var(--teal)}
.mf .x{font-size:13px;color:var(--dim);line-height:1.4}

/* ---------- bottom ---------- */
.bot{position:fixed;bottom:0;left:0;right:0;background:rgba(11,11,15,.97);backdrop-filter:blur(16px);
 border-top:1px solid var(--line);padding:11px 16px calc(11px + env(safe-area-inset-bottom));
 display:flex;gap:10px;align-items:center;z-index:60}
.sess{flex:1;text-align:center;min-width:0}
.sesst{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--w);line-height:1;
 font-variant-numeric:tabular-nums}
.sesst.idle{color:var(--ghost)}
.sesst.live{color:var(--green)}
.sessl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
 font-weight:800;margin-top:4px}
.bot .btn{min-width:88px;text-align:center}
.btn{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:11px;
 padding:12px 16px;font-size:14.5px;font-weight:700}
.btn.p{background:var(--purple);border-color:var(--purple);color:#08182A}
.btn:active{opacity:.7}
.chip.q{cursor:pointer}
.miniq{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);color:var(--dim);
 display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
 font-family:Georgia,'Times New Roman',serif;flex-shrink:0;cursor:pointer}
.miniq:active{border-color:var(--purple);color:var(--purple)}
.chip.q:active{border-color:var(--purple);background:rgba(94,147,196,.14)}
.achv{display:inline-flex;align-items:center;gap:5px;background:rgba(52,217,123,.14);
 border:1px solid rgba(52,217,123,.4);color:var(--green);border-radius:8px;padding:6px 10px;
 font-size:12.5px;font-weight:800;letter-spacing:.01em}
#sheet{position:fixed;inset:0;z-index:210;display:none;align-items:flex-end;justify-content:center;
 background:rgba(0,0,0,.62);backdrop-filter:blur(6px);opacity:0;transition:opacity .22s ease}
#sheet.on{display:flex}
#sheet.vis{opacity:1}
#sheet .panel{background:var(--card);width:calc(100% - 24px);max-width:520px;
 margin:0 12px calc(12px + env(safe-area-inset-bottom));border-radius:28px;
 padding:20px 22px 24px;border:1px solid var(--line);
 box-shadow:0 24px 60px rgba(0,0,0,.7),0 0 0 .5px rgba(255,255,255,.06);
 max-height:80vh;overflow-y:auto;overscroll-behavior:contain;
 transform:translateY(24px);transition:transform .26s cubic-bezier(.32,.72,0,1);
 touch-action:pan-y}
#sheet.vis .panel{transform:translateY(0)}
#sheet .panel.dragging{transition:none}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--ghost);margin:2px auto 16px;
 flex-shrink:0}
#sheet .shtag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--purple);
 font-weight:800;margin-bottom:8px}
#sheet h3{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;color:var(--w)}
#sheet .body{font-size:15.5px;line-height:1.6;color:var(--dim)}
#sheet .body b{color:var(--w);font-weight:700}
#sheet .eg{margin-top:18px;background:var(--ink);border:1px solid var(--line);border-radius:16px;
 padding:16px 17px;font-size:14.5px;color:var(--dim);line-height:1.6}
#sheet .eg .t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);
 font-weight:800;margin-bottom:9px}
#sheet .close{margin-top:18px;width:100%;background:var(--purple);color:#08182A;border:none;
 border-radius:14px;padding:15px;font-size:16px;font-weight:800}
#sheet .hint{text-align:center;font-size:12px;color:var(--faint);margin-top:12px}
#ask{position:fixed;inset:0;z-index:220;display:none;align-items:center;justify-content:center;
 background:rgba(0,0,0,.62);backdrop-filter:blur(6px);padding:24px}
#ask.on{display:flex}
#ask .askpanel{background:var(--card);border:1px solid var(--line);border-radius:22px;
 padding:24px 22px 20px;max-width:340px;width:100%;
 box-shadow:0 24px 60px rgba(0,0,0,.7),0 0 0 .5px rgba(255,255,255,.06)}
#ask h3{font-size:20px;font-weight:800;color:var(--w);margin-bottom:8px;letter-spacing:-.01em}
#ask p{font-size:15px;line-height:1.5;color:var(--dim);margin-bottom:20px}
#ask .askrow{display:flex;gap:10px}
#ask .askrow button{flex:1;border-radius:13px;padding:14px;font-size:15.5px;font-weight:800;border:none}
#ask .askno{background:var(--card2);color:var(--dim);border:1px solid var(--line)}
#ask .askyes{background:var(--purple);color:#08182A}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--card2);color:var(--w);
 border:1px solid var(--line);border-radius:11px;padding:11px 16px;font-size:13.5px;
 opacity:0;transition:.25s;pointer-events:none;z-index:70;white-space:nowrap}
.toast.on{opacity:1}

/* ---------- full-screen final countdown ---------- */
#ovl{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;
 align-items:center;justify-content:center;background:#12060A;text-align:center;padding:24px}
#ovl.on{display:flex}
#ovl .lbl{font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:#FF4D4D;font-weight:800}
#ovl .big{font-size:min(64vw,360px);font-weight:800;line-height:.9;letter-spacing:-.05em;
 font-variant-numeric:tabular-nums;color:#FF5D5D;margin:8px 0}
#ovl .sub{font-size:17px;color:#C98494;max-width:24ch;line-height:1.4}
#ovl .dismiss{margin-top:34px;background:transparent;border:1px solid #4A2230;color:#C98494;
 border-radius:12px;padding:14px 24px;font-size:15px;font-weight:700}
#ovl.flash{animation:fl .5s steps(1,end) infinite}
@keyframes fl{0%{background:#12060A}50%{background:#3A0A16}}
#ovl.go{background:#06180F;animation:none}
#ovl.go .big{color:#34D97B;font-size:min(32vw,200px)}
#ovl.go .lbl{color:#34D97B}
#ovl.go .sub{color:#7FC59B}
@media(prefers-reduced-motion:reduce){#ovl.flash{animation:none;background:#2A0A12}}
.cardio{margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;
 padding:15px 17px;font-size:13.5px;color:var(--dim)}
.cardio b{color:var(--purple);font-weight:700}
h4.sec{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rest);
 padding:24px 16px 0;font-weight:800;line-height:1.1}
h4.sec.daytitle{color:var(--rest);padding:24px 16px 0}
</style>

 {id:'squat',n:'Barbell Back Squat',a:'quad',p:'Quads',s:'Glutes, erectors',sch:'Top set + back-off',

  note:'If bar speed drops noticeably before your last rep, rack it at 2 RIR. Grinding a 6th rep adds fatigue, not muscle, in a deficit.',

 {id:'rdl',n:'Romanian Deadlift',a:'ham',p:'Hamstrings',s:'Glutes, erectors',sch:'Straight sets',

 {id:'nordic',n:'Nordic Hamstring Curl',a:'ham',p:'Hamstrings',s:'Eccentric strength',sch:'Straight sets',bw:1,wk:3,
  tempo:'slow-0-assist',rir:'1',sets:[{l:'1',r:'5',rest:90},{l:'2',r:'5',rest:90}],
  rule:'Slow the descent by 1s each week before adding reps',
  note:'Enters in week 3. Strongest evidence base of any exercise for preventing hamstring strains. Deliberately on Monday, not Thursday — Nordics produce 48-hour soreness and Thursday sits 48 hours before padel. On Nordic weeks, drop the Bulgarian split squat to 2 sets to hold the session at 70 minutes.',
  miss:'Dropping fast through the middle then catching yourself with your hands.',fix:'Fight for control through the whole range. If you can only resist the first 30°, use a band and build the range over weeks.'},
 {id:'bulg',n:'Bulgarian Split Squat',a:'quad',p:'Quads',s:'Glutes, single-leg stability',sch:'Double progression',
  tempo:'3-0-1',rir:'2',inc:2,sets:[{l:'1',r:'8',rest:90},{l:'2',r:'8',rest:90},{l:'3',r:'8',rest:90}],
  rule:'8 clean reps both legs on every set → +2kg per hand',
  note:'Reps are per leg. Padel is played almost entirely on one leg at a time — this is the exercise that transfers most directly to holding a lunge at the net without the knee collapsing inward.',
  miss:'Front foot too close, turning it into a knee-dominant grind.',fix:'Step the front foot out until the shin is roughly vertical at the bottom, then lean the torso 15° forward to load the glute.'},
 {id:'copen',n:'Copenhagen Plank',a:'abs',p:'Adductors',s:'Groin, obliques',sch:'Double progression',bw:1,
  tempo:'hold',rir:'1',rl:'Seconds',sets:[{l:'1',r:'25',rest:45},{l:'2',r:'25',rest:45},{l:'3',r:'25',rest:45}],
  rule:'30s clean both sides → progress from bent knee to full straight-leg lever',
  note:'Log seconds per side. Groin and adductor strains are the most common injury in padel and this movement has the best evidence base for preventing them. Thirty seconds a side is cheap insurance against six weeks off court.',
  miss:'Starting on the full straight-leg version and tweaking the groin in week one.',fix:'Start with the bottom knee bent and resting on the floor. Earn the long lever over 3–4 weeks.'},
 {id:'calf1',n:'Standing Calf Raise',a:'ham',p:'Calves',s:'Achilles',sch:'Double progression',
  tempo:'2-2-1',rir:'1',inc:5,sets:[{l:'1',r:'10',rest:60},{l:'2',r:'10',rest:60},{l:'3',r:'10',rest:60}],
  rule:'10 reps with a controlled 2s pause on every set → +5kg',
  note:'Every split-step, lunge and smash on Saturday loads the Achilles. A stiff, strong calf is what lets you change direction without the ankle absorbing it.',
  miss:'Bouncing out of the bottom using tendon recoil.',fix:'Pause a full two seconds at the deepest stretch so the muscle, not the tendon, does the work.'},
 {id:'carry',n:'Suitcase Carry',a:'abs',p:'Obliques',s:'Grip, trunk',sch:'Double progression',

  rule:'40m each side without leaning → +4kg',
  note:'Log metres per side. Finish here, then 10 minutes of Zone 2 on the bike to flush the legs.',
  miss:'Leaning away from the weight to counterbalance it.',fix:'Stack shoulders directly over hips and imagine the loaded side ribcage pulling down toward your hip.'},
]},
{k:'d2',d:'TUE',n:'Upper A',obj:'Horizontal push and pull — your heaviest pressing day',
 dur:'70 min',fat:'Moderate–High',cardio:'12 min Zone 2 on the bike, post-lift',

  rule:'Top set hits 5 clean twice → +2.5kg next week',

 {id:'pullup',n:'Weighted Pull-Up',a:'back',p:'Lats',s:'Upper back, biceps',sch:'Straight sets',bw:1,inc:2.5,
  tempo:'2-1-X',rir:'2',sets:[{l:'1',r:'6',rest:120},{l:'2',r:'6',rest:120},{l:'3',r:'6',rest:120},{l:'4',r:'6',rest:120}],
  rule:'6 clean reps on all 4 sets → +2.5kg on the belt',
  note:'Log added weight only — leave blank for bodyweight. Every rep starts from a full dead hang and finishes with the collarbone at the bar. Half reps here are the most commonly self-inflated volume in any program.',
  miss:'Kipping the last two reps and logging them as clean.',fix:'Cross your ankles behind you and squeeze the glutes. If the legs swing forward, the set is over.'},
 {id:'csrow',n:'Chest-Supported Row',a:'back',p:'Mid-back',s:'Rear delts, rhomboids',sch:'Double progression',

  rule:'10 reps with a 1s squeeze on all sets → +2.5kg',
  note:'Chest-supported so your lower back stays fresh — you already spent it on squats yesterday and you spend it again Thursday.',
  miss:'Pulling with the hands and finishing with the biceps.',fix:'Think of the hands as hooks and drive the elbows back into the wall behind you.'},
 {id:'incdb',n:'Incline Dumbbell Press',a:'chest',p:'Chest (upper)',s:'Front delts',sch:'Double progression',

  note:'Three seconds down. The lowering phase is where the growth stimulus lives, and it lets you get the same result with lighter dumbbells at 5am.',

 {id:'facepull',n:'Cable Face Pull',a:'delt',p:'Rear delts',s:'External rotators',sch:'Double progression',

const KEY='rp-log-v1', DKEY='rp-draft-v1', PKEY='rp-setplan-v1', WKEY='rp-week-v1';
let LOG={}, cur={}, dayIdx=0, doneMap={}, setCount={}, setPlan={};
let week=1;
const MAXWK=8;

/* ================= WEEK / PROGRESSION ENGINE =================
   Every prescription is derived, never stored. Weights carry forward from
   what you actually logged, so a missed week or a bad session self-corrects
   without anyone having to remember anything. */
const isDeload=w=>(w===4||w===8);
const isIntense=w=>(w>=5&&w<=7);
function phaseOf(w){ return isDeload(w)?'Deload':(isIntense(w)?'Intensify':'Build'); }
function phaseCopy(w){
  if(isDeload(w))return 'Deload week. Load drops to <b>60%</b>, sets are halved, stop at <b>4 RIR</b>. Nothing here changes your carried weights — week '+(w+1)+' picks up where week '+(w-1)+' left off.';
  if(isIntense(w))return 'Intensification. Top sets drop to <b>3–4 reps</b> at a heavier load, back-offs run at <b>85%</b>. Hold the strength while the deficit accumulates.';
  return 'Accumulation. Add load wherever you hit every rep target, hold it wherever you did not.';
}
const rnd=x=>Math.round(x/1.25)*1.25;
const incOf=ex=>(ex.inc!=null?ex.inc:2.5);
const backPct=w=>isIntense(w)?0.85:0.80;

/* rep target for a set in a given week */
function repTarget(ex,st,w){
  let r=String(st.r);
  if(isIntense(w)&&st.l==='TOP'&&ex.sch==='Top set + back-off'){
    const n=parseInt(r); if(!isNaN(n))r=String(Math.max(3,n-2));
  }
  return r;
}
const repNum=r=>parseInt(String(r).replace('ea','').split('-').pop())||0;

/* the raw prescribed list for a week, ignoring load (used for targets) */
function weekList(ex,w){
  let list=setsRaw(ex).map(x=>({...x}));
  if(isDeload(w))list=list.slice(0,Math.max(1,Math.ceil(list.length/2)));
  return list.map(st=>({...st,r:repTarget(ex,st,w)}));
}
/* the session actually logged in a given week */
function recForWeek(ex,w){
  if(w===week){
    const live=(cur[ex.id]||[]).filter(x=>x&&(x.w||x.r));
    if(live.length)return {sets:live.map(x=>({w:x.w??null,r:x.r??null}))};
  }
  const h=(LOG[ex.id]||[]).filter(r=>(r.wk||1)===w);
  return h.length?h[h.length-1]:null;
}
function firstLogged(ex){
  const h=LOG[ex.id]||[];
  for(const r of h){ if(r.sets&&r.sets.some(x=>x.w))return r; }
  return null;
}
/* baseline load = the heaviest set of the first session you ever logged */
function baseline(ex){
  const f=firstLogged(ex); if(!f)return null;
  const ws=f.sets.filter(x=>x.w).map(x=>x.w);
  return ws.length?Math.max(...ws):null;
}
function firstWeek(ex){ const f=firstLogged(ex); return f?(f.wk||1):null; }

/* did the session meet its targets?  1 = hit, 0 = repeat, -1 = back off */
function verdict(ex,rec,w){
  if(!rec||!rec.sets||!rec.sets.length)return null;
  const list=weekList(ex,w);
  let tot=0,got=0,all=true;
  list.forEach((st,i)=>{
    const t=repNum(st.r); tot+=t;
    const r=rec.sets[i]&&rec.sets[i].r?rec.sets[i].r:0;
    got+=Math.min(r,t*1.5);
    if(r<t)all=false;
  });
  if(all)return 1;
  if(tot&&got<tot*0.7)return -1;
  return 0;
}
/* working weight carried into week w */
function carryFor(ex,w){
  if(incOf(ex)===0)return baseline(ex);
  let c=baseline(ex); if(c==null)return null;
  const start=firstWeek(ex)||1;
  for(let i=start;i<w;i++){
    if(isDeload(i))continue;
    const v=verdict(ex,recForWeek(ex,i),i);
    if(v===1)c+=incOf(ex);
    else if(v===-1)c=Math.max(c-incOf(ex),c*0.9);
  }
  if(isIntense(w)&&!isIntense(start)&&ex.sch==='Top set + back-off')c+=incOf(ex);
  return rnd(c);
}
/* full prescription for this week: sets with target weights and reps */
function setsOf(ex){
  const list=weekList(ex,week);
  const c=carryFor(ex,week);
  return list.map(st=>{
    const o={...st};
    if(c!=null){
      let pct=1;
      if(ex.sch==='Top set + back-off'&&st.l!=='TOP')pct=(ex.back||backPct(week));
      o.w=rnd(c*pct*(isDeload(week)?0.6:1));
      if(o.w<=0)o.w=null;
    }
    return o;
  });
}
/* what the app will tell you to do next week, computed live */
function nextChange(ex){
  if(week>=MAXWK)return {txt:'Block complete — retest and rebuild',cls:'hold'};
  const nw=week+1;
  const now=carryFor(ex,week), nxt=carryFor(ex,nw);
  const topNow=weekList(ex,week)[0], topNxt=weekList(ex,nw)[0];
  const repsChanged=topNow&&topNxt&&topNow.r!==topNxt.r;
  if(nxt==null)return {txt:'Log this session to set your baseline',cls:'hold'};
  const v=verdict(ex,recForWeek(ex,week),week);
  let head='',cls='';
  if(isDeload(nw)){ head='Week '+nw+' · deload'; cls='dl'; }
  else if(v===1){ head='Week '+nw; }
  else if(v===-1){ head='Week '+nw+' · back off'; cls='hold'; }
  else if(v===0){ head='Week '+nw+' · repeat'; cls='hold'; }
  else { head='Week '+nw; cls='hold'; }
  const shown=rnd(nxt*(isDeload(nw)?0.6:1));
  /* only show a delta when we're comparing like with like */
  const d=(isDeload(nw)===isDeload(week)&&now!=null&&nxt!=null)?rnd(shown-rnd(now*(isDeload(week)?0.6:1))):0;
  const unit=ex.wu||'kg';
  let txt=head+': <b>'+shown+unit+(d?' ('+(d>0?'+':'')+d+')':'')+'</b>';
  if(repsChanged)txt+=' × <b>'+topNxt.r+'</b> on the top set';
  if(incOf(ex)===0)txt=head+': <b>same load</b> — progress control, not weight';
  return {txt,cls};
}
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=s=>new Date(s+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);
 t._x=setTimeout(()=>t.classList.remove('on'),1700)};

/* ---------------- TIMER (clock-based, survives backgrounding) ---------------- */
/* We never count down by decrementing. We store an absolute end timestamp and
   derive remaining time from the system clock, so freezing/closing the app
   cannot desynchronise it. */
let T={total:0,endAt:0,pausedLeft:null,run:false,iv:null,label:''};
let lastTick=null, AC=null;
const TKEY='rp-timer-v1';

function tLeft(){
  if(!T.total)return 0;
  if(!T.run)return T.pausedLeft??0;
  return Math.max(0,Math.ceil((T.endAt-Date.now())/1000));
}
function saveTimer(){
  try{
    if(!T.total){store.del(TKEY);return}
    store.set(TKEY,JSON.stringify({total:T.total,endAt:T.endAt,
      pausedLeft:T.pausedLeft,run:T.run,label:T.label}));
  }catch(e){}
}
async function restoreTimer(){
  try{
    const v=await store.get(TKEY); if(!v)return;
    const s=JSON.parse(v);
    T.total=s.total;T.endAt=s.endAt;T.pausedLeft=s.pausedLeft;T.run=s.run;T.label=s.label||'';
    if(T.run){
      const left=tLeft();
      if(left<=0){ // finished while you were away
        T.run=false;T.pausedLeft=0;tShow();
        $('#tl1').textContent='Rest finished while away';
        $('#tl2').textContent=T.label;
        return;
      }
      loop();
    }
    tShow();
  }catch(e){}
}
function tone(freq,dur,vol,delay){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.frequency.value=freq;o.type='sine';
    const t0=AC.currentTime+(delay||0);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.02);
    g.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.start(t0);o.stop(t0+dur+.02);
  }catch(e){}
}
function beep(){ // rest complete
  [0,.18,.36].forEach((d,i)=>tone(i===2?1046:784,.16,.32,d));
  if(navigator.vibrate)navigator.vibrate([180,90,180]);
}
function tick(){ // each of the final 10 seconds
  tone(660,.09,.22,0);
  if(navigator.vibrate)navigator.vibrate(45);
}

const OVL=()=>document.getElementById('ovl');
function warnPulse(n){
  const el=document.getElementById('timer');
  el.classList.add('warn','flash'); el.classList.remove('go');
}
function goPulse(){
  const el=document.getElementById('timer');
  el.classList.remove('flash','warn'); el.classList.add('go');
  clearTimeout(el._g); el._g=setTimeout(()=>el.classList.remove('go'),2600);
}
function clearPulse(){
  const el=document.getElementById('timer');
  el.classList.remove('flash','warn','go'); clearTimeout(el._g);
}
function ovlShow(n){
  const o=OVL();
  o.classList.add('on','flash');o.classList.remove('go');
  document.getElementById('ovlLbl').textContent='Rest ending';
  document.getElementById('ovlNum').textContent=n;
  document.getElementById('ovlSub').textContent=T.label||'Next set coming up';
}
function ovlGo(){
  const o=OVL();
  o.classList.remove('flash');o.classList.add('on','go');
  document.getElementById('ovlLbl').textContent='Rest complete';
  document.getElementById('ovlNum').textContent='GO';
  document.getElementById('ovlSub').textContent=T.label||'';
  clearTimeout(o._h);o._h=setTimeout(ovlHide,1400);   // straight back to the workout
}
function ovlHide(){const o=OVL();o.classList.remove('on','flash','go');clearTimeout(o._h)}
document.getElementById('ovlX').onclick=ovlHide;
OVL().onclick=e=>{if(e.target.id==='ovl')ovlHide()};
function tShow(){
  const left=tLeft();
  const m=Math.floor(left/60),s=left%60;
  $('#tdisp').textContent=T.total? (m+':'+String(s).padStart(2,'0')) : '0:00';
  $('#tdisp').classList.toggle('idle', !T.total);
  $('#tbar').style.width=T.total? ((T.total-left)/T.total*100)+'%' : '0%';
  $('#tTog').textContent=T.run?'❚❚':'▶';
  const el=$('#timer');
  const warn=T.total>0&&left>0&&left<=10;
  el.classList.toggle('run',T.run&&left>10);
  el.classList.toggle('warn',warn);
  if(!warn)el.classList.remove('flash');
  el.classList.toggle('done',T.total>0&&left<=0&&!el.classList.contains('go'));
  if(T.total&&left<=0){$('#tl1').textContent='Rest complete';$('#tl2').textContent='Go — next set';}
  else if(warn){$('#tl1').textContent='Get ready';$('#tl2').textContent=T.label;}
  else if(T.total){$('#tl1').textContent=T.run?'Resting':'Paused';$('#tl2').textContent=T.label;}
}
function loop(){
  clearInterval(T.iv);
  T.iv=setInterval(()=>{
    if(!T.run)return;
    const left=tLeft();
    if(left!==lastTick){
      if(left<=0){
        lastTick=0;T.run=false;T.pausedLeft=0;clearInterval(T.iv);
        beep();goPulse();notify();saveTimer();tShow();return;
      }
      if(left<=10){warnPulse(left);tick()}
      lastTick=left;
    }
    tShow();
  },250);
}
function tStart(sec,label){
  clearInterval(T.iv);ovlHide();
  T.total=sec;T.endAt=Date.now()+sec*1000;T.pausedLeft=null;T.run=true;T.label=label;
  lastTick=null;

  $('#tl1').textContent='Resting';$('#tl2').textContent=label;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}
  askNotify(); keepAwake();
  loop();saveTimer();tShow();
}

};

    if('wakeLock' in navigator && !wl){
      wl=await navigator.wakeLock.request('screen');

/* ---------------- STORAGE LAYER ----------------
   Works in three environments, in order of preference:
   1. Claude artifact storage (window.storage)
   2. Browser localStorage  (downloaded file / hosted anywhere / home-screen app)
   3. In-memory            (last resort, private-mode edge cases)            */
const store=(()=>{
  const hasClaude = typeof window.storage!=='undefined' && window.storage
                    && typeof window.storage.get==='function';
  let lsOK=false;
  try{ const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); lsOK=true; }catch(e){ lsOK=false; }
  const mem={};
  const mode = hasClaude?'claude' : lsOK?'local' : 'memory';
  return {
    mode,
    async get(k){
      try{
        if(mode==='claude'){ const r=await window.storage.get(k); return r&&r.value!=null?r.value:null; }
        if(mode==='local'){ return localStorage.getItem(k); }
        return mem[k]??null;
      }catch(e){ return null; }
    },
    async set(k,v){
      try{
        if(mode==='claude'){ await window.storage.set(k,v); return true; }
        if(mode==='local'){ localStorage.setItem(k,v); return true; }
        mem[k]=v; return true;
      }catch(e){ return false; }
    },
    async del(k){
      try{
        if(mode==='claude'){ await window.storage.delete(k); return true; }
        if(mode==='local'){ localStorage.removeItem(k); return true; }
        delete mem[k]; return true;
      }catch(e){ return false; }
    }
  };
})();

/* how many sets to show for an exercise — prescribed, unless you've changed it */
function setsRaw(ex){
  const n=setCount[ex.id] ?? setPlan[ex.id] ?? ex.sets.length;
  if(n===ex.sets.length)return ex.sets;
  if(n<ex.sets.length)return ex.sets.slice(0,n);
  const out=ex.sets.slice();
  const base=ex.sets[ex.sets.length-1];          // extra sets copy the last one
  let next=ex.sets.filter(s=>s.l!=='TOP').length; // continue the working-set numbering
  for(let i=ex.sets.length;i<n;i++){
    next++;
    out.push({l:String(next),r:base.r,rest:base.rest,w:base.w,extra:true});
  }
  return out;
}
/* ---- move to the next unfinished exercise once one is complete ---- */
let advTimer=null;
function advanceIfDone(id){
  const day=PROG[dayIdx];
  const ex=day.ex.find(e=>e.id===id); if(!ex||!isDone(ex))return;
  const i=day.ex.findIndex(e=>e.id===id);
  const next=day.ex.slice(i+1).find(e=>!isDone(e))     // next one below
          || day.ex.find(e=>!isDone(e));               // else first one still open
  clearTimeout(advTimer);
  advTimer=setTimeout(()=>{
    if(next){
      const el=document.getElementById('ex-'+next.id);
      if(el){
        const y=el.getBoundingClientRect().top+window.scrollY-headerH()-10;
        window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
        el.classList.add('focusme');
        setTimeout(()=>el.classList.remove('focusme'),1400);
      }
    }else{
      // every exercise on this day is done
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
      toast('Day complete — tap Finish to log it');
    }
  },550);   // brief pause so you see the tick land
}
function headerH(){const h=document.querySelector('header');return h?h.getBoundingClientRect().height:0}

/* has the progression target been met this session? */
function achieved(ex){
  const c=cur[ex.id]||[];
  const list=setsOf(ex);
  if(!c.length)return false;
  return list.every((st,i)=>{
    const t=repNum(st.r);
    return c[i]&&c[i].r>=t;
  });
}
function flagText(ex){
  const nx=nextChange(ex);
  return '✓ Every target hit — '+nx.txt.replace(/<\/?b>/g,'');
}
function isDone(ex){
  if(doneMap[ex.id]===true)return true;    // manually ticked on
  if(doneMap[ex.id]===false)return false;  // manually ticked off
  const c=cur[ex.id]||[];
  return c.filter(s=>s&&s.r).length>=setsOf(ex).length;   // otherwise: auto
}
function checkFlag(id){
  const ex=PROG[dayIdx].ex.find(e=>e.id===id);if(!ex)return;
  const c=cur[id]||[];
  const ok=setsOf(ex).every((s,i)=>{
    const t=repNum(s.r);
    return c[i]&&c[i].r>=t;
  });
  const f=document.getElementById('flag-'+id);
  if(f){f.classList.toggle('on',ok); if(ok)f.textContent=flagText(ex);}
  const badge=document.querySelector('#ex-'+id+' .achv');
  if(ok&&!badge){const ch=document.querySelector('#ex-'+id+' .chips');
    if(ch){const sp=document.createElement('span');sp.className='achv';sp.textContent='✓ Target hit';ch.appendChild(sp);}}
  if(!ok&&badge)badge.remove();
  const card=document.getElementById('ex-'+id);
  if(card)card.classList.toggle('done',isDone(ex));
}
function progress(){
  const day=PROG[dayIdx];
  const done=day.ex.filter(isDone).length;
  /* bottom bar now shows the workout clock instead of a counter */
}

  const mins=sess.start?Math.max(1,Math.round((Date.now()-sess.start)/60000)):0;
  sessStop();
  const finished=PROG[dayIdx].n;
  const wasLast=(dayIdx===PROG.length-1);
  cur={};doneMap={};setCount={};
  dayIdx=(dayIdx+1)%PROG.length;                 // move on to the next day
  let rolled=false;
  if(wasLast&&week<MAXWK){                       // Friday done → next week opens
    week++; rolled=true; await store.set(WKEY,String(week));
  }
  await store.set(NKEY,String(dayIdx));          // and open there next time
  await store.del(SKEY);                         // don't restore old scroll
  paintWeek();
  saveDraft();render();window.scrollTo({top:0,behavior:'smooth'});
  toast(rolled?`Week ${week} open · ${phaseOf(week)} · targets updated`
              :`${finished} · ${mins} min · next up ${PROG[dayIdx].n}`);
};
$('#histBtn').onclick=()=>{
  const day=PROG[dayIdx];
  let todayCount=0;
  const parts=day.ex.map(ex=>{
    const h=(LOG[ex.id]||[]).slice();
    // today's unsaved work, shown at the top as in-progress
    const live=(cur[ex.id]||[]).filter(x=>x&&(x.w||x.r)).map(x=>({w:x.w??null,r:x.r??null}));
    const savedToday=h.length&&h[h.length-1].date===today();
    let liveRow='';
    if(live.length&&!savedToday){
      todayCount++;
      liveRow=`<div class="srow"><div class="sn" style="width:74px;color:var(--purple)">Today</div>
        <div style="font-size:13px;color:var(--w)">${live.map(x=>(x.w?x.w+'kg':'BW')+'×'+(x.r??'–')).join(', ')}
        <span style="color:var(--purple);font-weight:700"> · in progress</span></div></div>`;
    }
    if(!h.length&&!liveRow)
      return `<h4 class="sec">${ex.n}</h4><div class="rule"><span>No sessions logged</span></div>`;
    const rows=h.slice(-8).reverse().map(x=>{
      const isToday=x.date===today();
      return `<div class="srow"><div class="sn" style="width:74px;color:${isToday?'var(--purple)':'var(--faint)'}">${isToday?'Today':fmtD(x.date)}</div>
      <div style="font-size:13px;color:${isToday?'var(--w)':'var(--dim)'}">${x.sets.map(y=>(y.w?y.w+'kg':'BW')+'×'+(y.r??'–')).join(', ')}${isToday?'<span style="color:var(--green);font-weight:700"> · logged</span>':''}</div></div>`;
    }).join('');
    return `<h4 class="sec">${ex.n}</h4><div class="sets">${liveRow}${rows}</div>`;
  }).join('');
  $('#app').innerHTML=`<div class="meta"><div class="obj">History · ${day.n}</div>
    <div class="mrow"><div class="mi">Showing<b>Last 8 sessions</b></div>
    ${todayCount?`<div class="mi">Today<b style="color:var(--purple)">${todayCount} in progress</b></div>`:''}</div></div>${parts}`;
  $('#histBtn').textContent='Back';
  $('#histBtn').onclick=()=>{location.reload()};
};


/* ---------------- styled yes / no ---------------- */
function askYesNo(title,msg){
  return new Promise(res=>{
    const w=document.getElementById('ask');
    document.getElementById('askTitle').textContent=title;
    document.getElementById('askMsg').textContent=msg;
    w.classList.add('on');
    const done=v=>{ w.classList.remove('on');
      document.getElementById('askYes').onclick=null;
      document.getElementById('askNo').onclick=null;
      w.onclick=null; res(v); };
    document.getElementById('askYes').onclick=()=>done(true);
    document.getElementById('askNo').onclick=()=>done(false);
    w.onclick=e=>{ if(e.target.id==='ask')done(false); };
  });
}

/* ---------------- WORKOUT SESSION CLOCK ---------------- */
const SKEY2='rp-session-v1';
let sess={start:null,iv:null};
function sessFmt(ms){
  const t=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(t/3600), m=Math.floor(t%3600/60), sec=t%60;
  return h ? h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')
           : m+':'+String(sec).padStart(2,'0');
}
function sessPaint(){
  const el=document.getElementById('sessTime'); if(!el)return;
  const live=!!sess.start;
  el.textContent = live ? sessFmt(Date.now()-sess.start) : '0:00';
  el.classList.toggle('live',live);
  el.classList.toggle('idle',!live);
  document.getElementById('sessLbl').textContent = live ? 'In progress' : 'Workout';
  const b=document.getElementById('saveBtn'); if(b)b.textContent = live ? 'Finish' : 'Start';
}
function sessStart(){
  if(sess.start)return;
  sess.start=Date.now();
  try{store.set(SKEY2,JSON.stringify({start:sess.start,day:dayIdx}))}catch(e){}
  clearInterval(sess.iv); sess.iv=setInterval(sessPaint,1000); sessPaint();
  keepAwake();
}
function sessStop(){
  clearInterval(sess.iv); sess.iv=null; sess.start=null;
  try{store.del(SKEY2)}catch(e){}
  sessPaint();
}
async function sessRestore(){
  try{
    const v=await store.get(SKEY2); if(!v)return;
    const o=JSON.parse(v);
    if(o&&o.start&&Date.now()-o.start < 6*3600*1000){
      sess.start=o.start;
      clearInterval(sess.iv); sess.iv=setInterval(sessPaint,1000);
    }else{ store.del(SKEY2); }
  }catch(e){}
  sessPaint();
}

function openInfo(k){
  const d=INFO[k]; if(!d)return;
  document.getElementById('shTitle').innerHTML=d.t;
  document.getElementById('shTag').textContent='Guide';
  document.getElementById('shBody').innerHTML=d.b;
  document.getElementById('shEg').innerHTML=d.e;
  const sh=document.getElementById('sheet'), pn=sh.querySelector('.panel');
  pn.style.transform=''; sh.classList.add('on');
  requestAnimationFrame(()=>requestAnimationFrame(()=>sh.classList.add('vis')));
}
function closeInfo(){
  const sh=document.getElementById('sheet'), pn=sh.querySelector('.panel');
  sh.classList.remove('vis');
  pn.classList.remove('dragging');
  pn.style.transform='';
  setTimeout(()=>sh.classList.remove('on'),240);
}

/* ---- swipe down to dismiss ---- */
(function(){
  const sh=document.getElementById('sheet');
  const pn=sh.querySelector('.panel');
  let y0=null, dy=0, t0=0, dragging=false;
  const start=y=>{ if(pn.scrollTop>0)return; y0=y; t0=Date.now(); dy=0; dragging=true;
                   pn.classList.add('dragging'); };
  const move=y=>{
    if(!dragging||y0===null)return;
    dy=y-y0;
    if(dy<0)dy=dy/4;                      // resist upward
    pn.style.transform='translateY('+dy+'px)';
    sh.style.opacity=String(Math.max(0,1-dy/420));
  };
  const end=()=>{
    if(!dragging)return;
    dragging=false; pn.classList.remove('dragging');
    const fast=(Date.now()-t0)<300 && dy>60;
    sh.style.opacity='';
    if(dy>110||fast){
      pn.style.transform='translateY(120%)';
      setTimeout(closeInfo,180);
    }else{
      pn.style.transform='';
    }
    y0=null; dy=0;
  };
  pn.addEventListener('touchstart',e=>start(e.touches[0].clientY),{passive:true});
  pn.addEventListener('touchmove', e=>{
    if(dragging&&dy>0)e.preventDefault();
    move(e.touches[0].clientY);
  },{passive:false});
  pn.addEventListener('touchend',end);
  pn.addEventListener('touchcancel',end);
  // mouse support for desktop testing
  pn.addEventListener('mousedown',e=>{start(e.clientY);
    const mm=ev=>move(ev.clientY), mu=()=>{end();
      window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);};
    window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);});
})();
document.getElementById('shClose').onclick=closeInfo;
document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')closeInfo()};

document.getElementById('awakeBtn').onclick=toggleAwake;
(async()=>{ try{const v=await store.get('rp-awake-v1'); if(v==='0')awakeWanted=false;}catch(e){}
