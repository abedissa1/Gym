<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --ink:#04100A;          /* stadium base */
 --glow:52,217,123;      /* accent, as rgb parts */
 --acc:#49F09B;
 --w:#F2FFF8;
 --dim:rgba(255,255,255,.56);
 --faint:rgba(255,255,255,.34);
 --ghost:rgba(255,255,255,.17);
 --hair:rgba(255,255,255,.13);
}
:root{color-scheme:dark}
html{background:#04100A;min-height:100%;height:100%}
body{background:#04100A;color:var(--w);height:100%;overflow:hidden;margin:0;
 font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
 line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
.tab{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button,select,input{font-family:inherit;color:inherit}

/* ===== the stadium shell every screen sits in ===== */
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
#app:before{content:'';position:absolute;left:50%;top:50%;width:155%;height:110%;
 transform:translate(-50%,-62%);pointer-events:none;z-index:0;
 background:radial-gradient(closest-side,rgba(var(--glow),.30),rgba(var(--glow),.07) 55%,transparent 78%)}
#app:after{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
 background:radial-gradient(135% 80% at 50% 44%,transparent 40%,rgba(0,0,0,.74) 100%)}
.scr{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0;
 padding:calc(12px + env(safe-area-inset-top)) 20px calc(12px + env(safe-area-inset-bottom))}

/* ===== shared type ===== */
.eyebrow{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:800;color:rgba(var(--glow),.72)}
.meta{display:flex;justify-content:center;align-items:center;font-size:11.5px;letter-spacing:.14em;
 text-transform:uppercase;font-weight:800;color:var(--faint)}
.meta span{padding:0 13px}
.meta span+span{border-left:1px solid var(--hair)}
.cue{text-align:center;font-size:clamp(17px,4.8vw,21px);font-weight:800;line-height:1.28;
 letter-spacing:-.015em;color:var(--w);text-shadow:0 0 14px rgba(var(--glow),.3)}
.cue em{font-style:normal;color:rgba(120,230,170,.42);font-weight:600;padding:0 3px}
.bignum{font-weight:800;letter-spacing:-.055em;line-height:.84;color:#fff;
 display:flex;align-items:baseline;justify-content:center;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.bignum u{text-decoration:none;font-size:.34em;font-weight:700;letter-spacing:-.02em;
 color:rgba(255,255,255,.5);margin-left:.1em;align-self:flex-start;margin-top:.34em}
.bignum s{text-decoration:none;font-size:.4em;font-weight:400;color:rgba(var(--glow),.55);
 margin:0 .13em;align-self:center;position:relative;top:-.06em}

/* ===== top rail ===== */
.rail{display:flex;align-items:center;gap:10px;min-height:34px;flex:none}
.rail .sp{flex:1}
.iconb{width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);background:none;
 color:var(--faint);font-size:15px;font-weight:700;line-height:1;padding:0;flex:none;cursor:pointer;
 display:flex;align-items:center;justify-content:center}
.iconb:active{border-color:var(--acc);color:var(--acc)}
.clock{font-size:13px;font-weight:700;color:var(--faint);letter-spacing:.02em;
 background:none;border:1px solid transparent;border-radius:10px;padding:6px 9px;cursor:pointer;
 font-variant-numeric:tabular-nums;flex:none;transition:border-color .15s,color .15s}
.clock.live{color:var(--acc)}
.clock:active{border-color:rgba(var(--glow),.4);background:rgba(var(--glow),.08)}
.clock.ping{animation:clockPing .42s ease}
@keyframes clockPing{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}

/* exercise browser: a bare select over the whole rail */
.exsel{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px}
.exsel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;
 appearance:none;-webkit-appearance:none;border:0;background:none}
.exsel .lbl{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;
 color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exsel .cv{width:0;height:0;flex:none;border-left:4px solid transparent;border-right:4px solid transparent;
 border-top:5px solid rgba(var(--glow),.7)}

/* ===== pips ===== */
.pips{display:flex;gap:5px;justify-content:center;align-items:center;flex:none}
.pips i{display:block;height:3px;width:20px;border-radius:2px;background:var(--ghost)}
.pips i.did{background:rgba(var(--glow),.46)}
.pips i.now{background:var(--acc);width:34px;box-shadow:0 0 14px rgba(var(--glow),.75)}

/* ===== primary button ===== */
.cta{display:block;width:100%;border:0;border-radius:18px;padding:19px 20px;cursor:pointer;
 background:var(--acc);color:#04120A;font-size:17px;font-weight:800;letter-spacing:.14em;
 text-transform:uppercase;box-shadow:0 14px 40px rgba(var(--glow),.3)}
.cta:active{transform:scale(.985)}
.cta.ghost{background:none;border:1px solid var(--hair);color:var(--dim);box-shadow:none;
 font-size:13px;padding:15px 20px;letter-spacing:.16em}
.cta.ghost:active{border-color:var(--acc);color:var(--acc)}

/* ===================== HOME ===================== */
.home{flex:1;display:flex;flex-direction:column;justify-content:center;gap:0;min-height:0;
 width:100%;max-width:470px;margin-inline:auto}
.pickwrap{position:relative;text-align:center}
.pickwrap select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;
 appearance:none;-webkit-appearance:none;border:0;background:none}
.pickwrap .k{font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:800;
 color:rgba(var(--glow),.6);margin-bottom:6px}
.pickwrap .v{font-size:clamp(46px,15vw,70px);font-weight:800;letter-spacing:-.05em;line-height:.92;
 color:#fff;display:flex;align-items:center;justify-content:center;gap:12px}
.pickwrap .v .cv{width:0;height:0;flex:none;border-left:7px solid transparent;border-right:7px solid transparent;
 border-top:9px solid rgba(var(--glow),.65);margin-top:.12em}
.pickwrap.day .v{font-size:clamp(25px,7.4vw,34px);letter-spacing:-.025em}
.phasepill{margin-top:11px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;
 color:var(--faint)}
.phasepill b{color:rgba(var(--glow),.8);font-weight:800}
.homedivide{height:1px;margin:28px 0;
 background:linear-gradient(90deg,transparent,var(--hair) 25%,var(--hair) 75%,transparent)}
.daynote{margin-top:9px;font-size:13px;color:var(--faint);line-height:1.4}
.homecta{flex:none;padding-top:26px;width:100%;max-width:470px;margin-inline:auto}

/* ===================== WORKOUT ===================== */
.work{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:14px 0;
 width:100%;max-width:470px;margin-inline:auto}
.work .pipline{order:2;margin-top:15px;display:flex;align-items:center;gap:10px}
.work .pipline .pips{flex:1;min-width:0}
.work .pm{flex:none;font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:800;
 color:rgba(255,255,255,.72);padding-bottom:5px;border-bottom:1px solid rgba(var(--glow),.45);
 white-space:nowrap}
.work h1{order:1;text-align:center;font-size:clamp(29px,8.6vw,42px);font-weight:800;
 letter-spacing:-.035em;line-height:1.04;color:#fff;text-wrap:balance}
.work .musc{order:3}
.work .cue{order:4}
.work .sets{order:5}
.work .musc{margin-top:11px;text-align:center;font-size:12.5px;color:var(--faint);
 letter-spacing:.04em}

.work .cue{margin-top:16px}
.sets{margin-top:24px;flex:none;width:100%;max-width:335px;margin-inline:auto}
.srow{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid rgba(255,255,255,.07)}
.srow:last-of-type{border-bottom:1px solid rgba(255,255,255,.07)}
.srow .sl{width:64px;flex:none;white-space:nowrap;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
 font-weight:800;color:var(--faint)}
.srow.now .sl{color:var(--acc)}
.srow.did .sl{color:rgba(var(--glow),.5)}
.srow .fig{flex:1;min-width:0;display:flex;align-items:baseline;gap:3px;
 background:none;border:0;
 padding:7px 9px;margin:-7px -9px;border-radius:11px;cursor:pointer;font-size:21px;font-weight:800;
 letter-spacing:-.03em;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
.srow.now .fig{color:#fff;font-size:25px}
.srow .fig u{text-decoration:none;font-size:.56em;font-weight:700;color:var(--faint);margin-left:1px}
.srow .fig s{text-decoration:none;font-size:.62em;font-weight:400;color:rgba(var(--glow),.5);margin:0 .22em}
.srow .fig:active{background:rgba(var(--glow),.1)}
.srow .fig.edited{color:var(--acc)}
.srow.now .fig.edited{color:var(--acc)}
.play{width:46px;height:46px;flex:none;border-radius:50%;border:1px solid var(--hair);background:none;
 color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
.srow.now .play{border-color:var(--acc);color:#04120A;background:var(--acc);
 box-shadow:0 0 22px rgba(var(--glow),.4)}
.srow.did .play{border-color:rgba(var(--glow),.3);color:rgba(var(--glow),.5)}
.play:active{transform:scale(.93)}
.worknav{flex:none;padding-top:16px;display:flex;gap:9px;width:100%;max-width:470px;margin-inline:auto}
.worknav button{flex:1;background:none;border:1px solid var(--hair);color:var(--faint);border-radius:13px;
 padding:13px 10px;font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.worknav button:active{border-color:var(--acc);color:var(--acc)}
.worknav button.go{border-color:rgba(var(--glow),.45);color:var(--acc)}
.worknav button.arrow{flex:0 0 52px;font-size:19px;letter-spacing:0;padding:11px 0}

/* ===================== WARM-UP / CARDIO ===================== */
.card{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;
 width:100%;max-width:470px;margin-inline:auto;padding:10px 0}
.card h1{text-align:center;font-size:clamp(27px,8vw,38px);font-weight:800;letter-spacing:-.035em;
 line-height:1.05;color:#fff;text-wrap:balance}
.card .sub{margin-top:9px;text-align:center;font-size:12.5px;color:var(--faint);line-height:1.45}
.card .steps{margin-top:20px;width:100%;max-width:400px;margin-inline:auto;list-style:none}
.card .steps li{display:flex;gap:13px;align-items:flex-start;padding:10px 0;
 border-top:1px solid rgba(255,255,255,.07);font-size:15px;line-height:1.4;color:var(--dim)}
.card .steps li:last-child{border-bottom:1px solid rgba(255,255,255,.07)}

/* ================== STATE ================== */
const KEY='rp-log-v1', DKEY='rp-draft-v1', PKEY='rp-setplan-v1', WKEY='rp-week-v1',
      NKEY='rp-nextday-v1', TKEY='rp-timer-v1', SKEY2='rp-session-v1', VKEY='rp-view-v1';
let LOG={}, cur={}, doneMap={}, setCount={}, setPlan={};
let week=1, dayIdx=0, exIdx=0, view='home';
const MAXWK=16;
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=s=>new Date(s+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),1900)}

/* ================== STORAGE ==================
   Claude artifact storage → localStorage → memory, in that order. */
const store=(()=>{
  const hasClaude = typeof window.storage!=='undefined' && window.storage
                    && typeof window.storage.get==='function';
  let lsOK=false;
  try{ const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); lsOK=true; }catch(e){ lsOK=false; }
  const mem={};
  const mode = hasClaude?'claude' : lsOK?'local' : 'memory';
  return {
    mode,
    async get(k){ try{
      if(mode==='claude'){ const r=await window.storage.get(k); return r&&r.value!=null?r.value:null; }
      if(mode==='local'){ return localStorage.getItem(k); }
      return mem[k]??null;
    }catch(e){ return null } },
    async set(k,v){ try{
      if(mode==='claude'){ await window.storage.set(k,v); return true; }
      if(mode==='local'){ localStorage.setItem(k,v); return true; }
      mem[k]=v; return true;
    }catch(e){ return false } },
    async del(k){ try{
      if(mode==='claude'){ await window.storage.delete(k); return true; }
      if(mode==='local'){ localStorage.removeItem(k); return true; }
      delete mem[k]; return true;
    }catch(e){ return false } }
  };
})();
const savePlan=()=>{try{store.set(PKEY,JSON.stringify(setPlan))}catch(e){}};
const saveDraft=()=>{try{store.set(DKEY,JSON.stringify({date:today(),dayIdx,exIdx,cur,doneMap,setCount}))}catch(e){}};
const saveLog=()=>{try{return store.set(KEY,JSON.stringify(LOG))}catch(e){}};
const lastOf=id=>{const h=LOG[id];return h&&h.length?h[h.length-1]:null};

/* ---- export / import: the only backup that survives a redeploy ---- */
const backupText=()=>JSON.stringify({v:2, log:LOG, week, setPlan,
  exported:new Date().toISOString()});
async function copyBackup(ta){
  const txt=backupText();
  try{ await navigator.clipboard.writeText(txt); toast('History copied'); return }
  catch(e){}
  try{ ta.focus();ta.select();ta.setSelectionRange(0,txt.length);
       toast('Selected — copy it with your keyboard or long press') }
  catch(e){ toast('Select the text and copy it') }
}
async function applyBackup(txt){
  if(!txt||!txt.trim()){ toast('Nothing to import'); return }
  try{
    const b=JSON.parse(txt);
    if(!b.log)throw 0;
    let added=0;                                  // merge, never overwrite
    Object.keys(b.log).forEach(id=>{
      const incoming=b.log[id]||[], have=LOG[id]||[];
      incoming.forEach(rec=>{
        const i=have.findIndex(r=>r.date===rec.date);
        if(i>=0)have[i]=rec; else {have.push(rec);added++}
      });
      have.sort((a,c)=>String(a.date).localeCompare(String(c.date)));
      LOG[id]=have;
    });
    await saveLog();
    if(b.week){week=Math.max(1,Math.min(MAXWK,parseInt(b.week)||1));await store.set(WKEY,String(week))}
    if(b.setPlan){setPlan=b.setPlan;await savePlan()}
    render(); toast(added?`Restored · ${added} sessions added`:'Restored · nothing new');
  }catch(e){ toast('That does not look like a history export') }
}

/* ================== SCREEN WAKE LOCK ==================
   Always on while the app is open. No switch, nothing to forget. */
let wl=null;
async function keepAwake(){
  try{
    if('wakeLock' in navigator && !wl){
      wl=await navigator.wakeLock.request('screen');
      wl.addEventListener('release',()=>{wl=null});
    }
  }catch(e){}
}
['pointerdown','touchstart','keydown','visibilitychange'].forEach(ev=>
  window.addEventListener(ev,()=>{if(document.visibilityState==='visible')keepAwake()},{passive:true}));

/* ================== REST TIMER ==================
   Clock-based: we store an absolute end time and derive the remainder from the
   system clock, so backgrounding or locking the phone cannot desynchronise it. */
let T={total:0,endAt:0,pausedLeft:null,run:false,iv:null,exid:null,si:null};
let lastTick=null, AC=null;
function tLeft(){
  if(!T.total)return 0;
  if(!T.run)return T.pausedLeft??0;
  return Math.max(0,Math.ceil((T.endAt-Date.now())/1000));
}
function saveTimer(){
  try{store.set(TKEY,JSON.stringify({total:T.total,endAt:T.endAt,pausedLeft:T.pausedLeft,
    run:T.run,exid:T.exid,si:T.si,day:dayIdx,at:Date.now()}))}catch(e){}
}
async function restoreTimer(){
  try{
    const v=await store.get(TKEY); if(!v)return;
    const s=JSON.parse(v);
    if(!s||!s.total||Date.now()-s.at>6*3600*1000){store.del(TKEY);return}
    T.total=s.total;T.endAt=s.endAt;T.pausedLeft=s.pausedLeft;T.run=s.run;
    T.exid=s.exid;T.si=s.si;
    if(T.run && tLeft()<=0){ T.run=false;T.pausedLeft=0; restDone(true); return }
    if(T.total && (T.run || (T.pausedLeft||0)>0)) view='rest';   // pick the rest back up
  }catch(e){}
}
/* one struck partial: fast attack, exponential decay */
function partial(f,peak,dur,delay){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
    const t=AC.currentTime+(delay||0);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(peak,t+.004);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t);o.stop(t+dur+.03);
  }catch(e){}
}
/* a tubular-bell strike: fundamental plus its inharmonic partials */
function chime(f,peak,dur,delay){
  partial(f,peak,dur,delay);
  partial(f*2.76,peak*.3,dur*.78,delay);
  partial(f*5.4,peak*.12,dur*.5,delay);
}
/* the last ten seconds: one bell per second, lifting a fourth for the final three */
function buzz(ms){ try{ if(navigator.vibrate)navigator.vibrate(ms) }catch(e){} }
function tick(n){
  if(n<=3){ chime(783.99,.62,.9,0); buzz(50) }        // G5
  else if(n<=5){ chime(659.25,.5,.9,0); buzz(40) }    // E5
  else chime(659.25,.4,.8,0);
}
function beep(){                                       // zero: C–E–G rising
  [[523.25,0],[659.25,.16],[783.99,.32]].forEach(([f,d])=>chime(f,.72,1.5,d));
  buzz([80,70,80,70,160]);
}
function notify(label){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const n=new Notification('Rest complete',{body:(label||'Next set')+' — go',tag:'rest',renotify:true});
    n.onclick=()=>{window.focus();n.close()};
  }catch(e){}
}
let notifAsked=false;
function askNotify(){
  if(notifAsked||!('Notification' in window))return;
  notifAsked=true;
  if(Notification.permission==='default'){try{Notification.requestPermission()}catch(e){}}
}
function loop(){
  clearInterval(T.iv);
  T.iv=setInterval(()=>{
    if(!T.run)return;
    const left=tLeft();
    if(left!==lastTick){
      if(left<=0){
        lastTick=0;T.run=false;T.pausedLeft=0;clearInterval(T.iv);
        beep();notify(T.label);saveTimer();restDone();return;
      }
      if(left<=10)tick(left);
      lastTick=left;
      paintRest();
    }
  },250);
}
function startRest(sec,exid,si,label){
  clearInterval(T.iv);
  T.total=sec;T.endAt=Date.now()+sec*1000;T.pausedLeft=null;T.run=true;
  T.exid=exid;T.si=si;T.label=label;
  lastTick=null;
  askNotify();keepAwake();
  view='rest';saveView();
  loop();saveTimer();render();
}
function stopRest(){
  clearInterval(T.iv);T.run=false;T.total=0;T.pausedLeft=null;
  try{store.del(TKEY)}catch(e){}
}
function togglePause(){
  if(!T.total)return;
  if(T.run){const left=tLeft();T.run=false;T.pausedLeft=left;clearInterval(T.iv)}
  else{
    const left=T.pausedLeft??0;
    if(left<=0){restDone();return}
    T.endAt=Date.now()+left*1000;T.pausedLeft=null;T.run=true;lastTick=null;loop();
  }
  saveTimer();paintRest();
}
function addRest(sec){
  if(!T.total)return;
  if(T.run)T.endAt+=sec*1000; else T.pausedLeft=(T.pausedLeft??0)+sec;
  T.total+=sec;lastTick=null;saveTimer();paintRest();
}


/* ================= WEEK / PROGRESSION ENGINE =================
   Every prescription is derived, never stored. Weights carry forward from
   what you actually logged, so a missed week or a bad session self-corrects
   without anyone having to remember anything. */
const isDeload=w=>(w%4===0);                       // weeks 4, 8, 12, 16
const isIntense=w=>((w>=5&&w<=7)||(w>=13&&w<=15)); // the two heavy phases
function phaseOf(w){ return isDeload(w)?'Deload':(isIntense(w)?'Intensify':'Build'); }
function phaseCopy(w){
  if(w===MAXWK)return 'Final week. Deload to <b>60%</b>, half the sets, then retest the four main lifts, body composition and FTP. Rebuild the next block off those numbers.';
  if(isDeload(w))return 'Deload week. Load drops to <b>60%</b>, sets are halved, stop at <b>4 RIR</b>. Nothing here changes your carried weights — week '+(w+1)+' picks up where week '+(w-1)+' left off.';
  if(isIntense(w))return 'Intensification. Top sets drop to <b>3–4 reps</b> at a heavier load, back-offs run at <b>85%</b>. Hold the strength while the deficit accumulates.';
  return 'Accumulation. Add load wherever you hit every rep target, hold it wherever you did not.';
}
const rnd=x=>Math.round(x/1.25)*1.25;
const incOf=ex=>(ex.inc!=null?ex.inc:2.5);
const backPct=w=>isIntense(w)?0.85:0.80;

/* rep target for a set in a given week */
function repTarget(ex,st,w){
  let r=String(st.r);
  if(isIntense(w)&&st.l==='TOP'&&ex.sch==='Top set + back-off'){
    const n=parseInt(r); if(!isNaN(n))r=String(Math.max(3,n-2));
  }
  return r;
}
const repNum=r=>parseInt(String(r).replace('ea','').split('-').pop())||0;

/* the raw prescribed list for a week, ignoring load (used for targets) */
function weekList(ex,w){
  let list=setsRaw(ex).map(x=>({...x}));
  if(isDeload(w))list=list.slice(0,Math.max(1,Math.ceil(list.length/2)));
  return list.map(st=>({...st,r:repTarget(ex,st,w)}));
}
/* the session actually logged in a given week */
function recForWeek(ex,w){
  if(w===week){
    const live=(cur[ex.id]||[]).filter(x=>x&&(x.w||x.r));
    if(live.length)return {sets:live.map(x=>({w:x.w??null,r:x.r??null}))};
  }
  const h=(LOG[ex.id]||[]).filter(r=>(r.wk||1)===w);
  return h.length?h[h.length-1]:null;
}
function firstLogged(ex){
  const h=LOG[ex.id]||[];
  for(const r of h){ if(r.sets&&r.sets.some(x=>x.w))return r; }
  return null;
}
/* baseline load = the heaviest set of the first session you ever logged */
function baseline(ex){
  const f=firstLogged(ex); if(!f)return null;
  const ws=f.sets.filter(x=>x.w).map(x=>x.w);
  return ws.length?Math.max(...ws):null;
}
function firstWeek(ex){ const f=firstLogged(ex); return f?(f.wk||1):null; }

/* did the session meet its targets?  1 = hit, 0 = repeat, -1 = back off */
function verdict(ex,rec,w){
  if(!rec||!rec.sets||!rec.sets.length)return null;
  const list=weekList(ex,w);
  let tot=0,got=0,all=true;
  list.forEach((st,i)=>{
    const t=repNum(st.r); tot+=t;
    const r=rec.sets[i]&&rec.sets[i].r?rec.sets[i].r:0;
    got+=Math.min(r,t*1.5);
    if(r<t)all=false;
  });
  if(all)return 1;
  if(tot&&got<tot*0.7)return -1;
  return 0;
}
/* working weight carried into week w */
function carryFor(ex,w){
  if(incOf(ex)===0)return baseline(ex);
  let c=baseline(ex); if(c==null)return null;
  const start=firstWeek(ex)||1;
  for(let i=start;i<w;i++){
    if(isDeload(i))continue;
    const v=verdict(ex,recForWeek(ex,i),i);
    if(v===1)c+=incOf(ex);
    else if(v===-1)c=Math.max(c-incOf(ex),c*0.9);
  }
  if(isIntense(w)&&!isIntense(start)&&ex.sch==='Top set + back-off')c+=incOf(ex);
  return rnd(c);
}
/* full prescription for this week: sets with target weights and reps */
function setsOf(ex){
  const list=weekList(ex,week);
  const c=carryFor(ex,week);
  return list.map(st=>{
    const o={...st};
    if(c!=null){
      let pct=1;
      if(ex.sch==='Top set + back-off'&&st.l!=='TOP')pct=(ex.back||backPct(week));
      o.w=rnd(c*pct*(isDeload(week)?0.6:1));
      if(o.w<=0)o.w=null;
    }
    return o;
  });
}
/* what the app will tell you to do next week, computed live */
function nextChange(ex){
  if(week>=MAXWK)return {txt:'Block complete — retest and rebuild',cls:'hold'};
  const nw=week+1;
  const now=carryFor(ex,week), nxt=carryFor(ex,nw);
  const topNow=weekList(ex,week)[0], topNxt=weekList(ex,nw)[0];
  const repsChanged=topNow&&topNxt&&topNow.r!==topNxt.r;
  if(nxt==null)return {txt:'Log this session to set your baseline',cls:'hold'};
  const v=verdict(ex,recForWeek(ex,week),week);
  let head='',cls='';
  if(isDeload(nw)){ head='Week '+nw+' · deload'; cls='dl'; }
  else if(v===1){ head='Week '+nw; }
  else if(v===-1){ head='Week '+nw+' · back off'; cls='hold'; }
  else if(v===0){ head='Week '+nw+' · repeat'; cls='hold'; }
  else { head='Week '+nw; cls='hold'; }
  const shown=rnd(nxt*(isDeload(nw)?0.6:1));
  /* only show a delta when we're comparing like with like */
  const d=(isDeload(nw)===isDeload(week)&&now!=null&&nxt!=null)?rnd(shown-rnd(now*(isDeload(week)?0.6:1))):0;
  const unit=ex.wu||'kg';
  let txt=head+': <b>'+shown+unit+(d?' ('+(d>0?'+':'')+d+')':'')+'</b>';
  if(repsChanged)txt+=' × <b>'+topNxt.r+'</b> on the top set';
  if(incOf(ex)===0)txt=head+': <b>same load</b> — progress control, not weight';
  return {txt,cls};
}

/* how many sets to show for an exercise — prescribed, unless you've changed it */
function setsRaw(ex){
  const n=setCount[ex.id] ?? setPlan[ex.id] ?? ex.sets.length;
  if(n===ex.sets.length)return ex.sets;
  if(n<ex.sets.length)return ex.sets.slice(0,n);
  const out=ex.sets.slice();
  const base=ex.sets[ex.sets.length-1];          // extra sets copy the last one
  let next=ex.sets.filter(s=>s.l!=='TOP').length; // continue the working-set numbering
  for(let i=ex.sets.length;i<n;i++){
    next++;
    out.push({l:String(next),r:base.r,rest:base.rest,w:base.w,extra:true});
  }
  return out;
}

/* ================== DERIVED HELPERS ================== */
function vis(e){ return !(e.wk&&week<e.wk) && !(e.wkMax&&week>e.wkMax) }
const exList=()=>(PROG[dayIdx]?PROG[dayIdx].ex.filter(vis):[]);
const curEx=()=>exList()[Math.min(exIdx,Math.max(0,exList().length-1))]||null;
const unitOf=ex=>ex.wu||'kg';
const setDone=(ex,i)=>!!(cur[ex.id]&&cur[ex.id][i]&&cur[ex.id][i].r!=null);
const exDone=ex=>{const n=setsOf(ex).length;let c=0;for(let i=0;i<n;i++)if(setDone(ex,i))c++;return c>=n};
function nowSet(ex){
  const n=setsOf(ex).length;
  for(let i=0;i<n;i++)if(!setDone(ex,i))return i;
  return n-1;
}
/* what the row shows: what you logged, else what the week prescribes */
function shownVal(ex,i){
  const st=setsOf(ex)[i]||{};
  const v=(cur[ex.id]&&cur[ex.id][i])||{};
  return { w:(v.w!=null?v.w:st.w), r:(v.r!=null?v.r:st.r), logged:(v.r!=null), target:st };
}
const cueHTML=ex=>String(ex.cue||'').split('|').map(esc).join('<em>/</em>');
const tempoLbl=ex=>ex.tl?esc(ex.tempo):'Tempo '+esc(ex.tempo);
const rirLbl=ex=>/RPE|fresh/i.test(ex.rir)?esc(ex.rir):esc(ex.rir)+' RIR';
function setLbl(ex,i){
  const sets=setsOf(ex);
  if(sets.length===1)return 'Only set';
  if(sets[i].l==='TOP')return 'Top set';
  if(i===sets.length-1)return 'Last set';
  return 'Set '+(i+1);
}
const saveView=()=>{try{store.set(VKEY,JSON.stringify({view,dayIdx,exIdx,week}))}catch(e){}};

/* ================== SESSION CLOCK ================== */
let sess={start:null,iv:null};
const sessFmt=ms=>{const t=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  return h?h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')
          :m+':'+String(s).padStart(2,'0')};
function sessPaint(){
  const el=document.getElementById('clock'); if(!el)return;
  el.textContent=sess.start?sessFmt(Date.now()-sess.start):'0:00';
  el.classList.toggle('live',!!sess.start);
}
/* tap the clock to put it back to zero, or to start it if it is not running */
function resetClock(){
  if(!sess.start){ sessStart(); sessPaint(); toast('Clock started'); return }
  sess.start=Date.now();
  try{store.set(SKEY2,JSON.stringify({start:sess.start,day:dayIdx}))}catch(e){}
  clearInterval(sess.iv);sess.iv=setInterval(sessPaint,1000);
  sessPaint();
  const el=document.getElementById('clock');
  if(el){el.classList.add('ping');setTimeout(()=>el.classList.remove('ping'),420)}
  toast('Clock reset');
}
function sessStart(){
  if(sess.start)return;
  sess.start=Date.now();
  try{store.set(SKEY2,JSON.stringify({start:sess.start,day:dayIdx}))}catch(e){}
  clearInterval(sess.iv);sess.iv=setInterval(sessPaint,1000);
}
function sessStop(){clearInterval(sess.iv);sess.iv=null;sess.start=null;try{store.del(SKEY2)}catch(e){}}
async function sessRestore(){
  try{
    const v=await store.get(SKEY2); if(!v)return;
    const o=JSON.parse(v);
    if(o&&o.start&&Date.now()-o.start<6*3600*1000){
      sess.start=o.start;clearInterval(sess.iv);sess.iv=setInterval(sessPaint,1000);
    }else store.del(SKEY2);
  }catch(e){}
}

/* ================== REST FLOW ================== */
function restDone(silent){
  const exid=T.exid, si=T.si;
  stopRest();
  const list=exList();
  const ex=list.find(e=>e.id===exid);
  if(!ex){ view='work'; saveView(); render(); return }
  const sets=setsOf(ex);
  if(si!=null && si>=sets.length-1){           // that was the last set
    const i=list.indexOf(ex);
    if(i+1<list.length){ exIdx=i+1; view='work'; pendingSlide='R'; }
    else { view=hasCardio()?'cardio':'done'; pendingSlide='R'; }
  }else{
    exIdx=list.indexOf(ex); view='work';
  }
  saveView(); saveDraft(); render();
  if(!silent && view==='work'){
    const nx=curEx();
    if(nx && nx.id!==exid) toast('Next · '+nx.n);
  }
}
/* pressing play logs the set at whatever the row shows, then rests */
function playSet(i){
  const ex=curEx(); if(!ex)return;
  sessStart();
  const v=shownVal(ex,i);
  cur[ex.id]=cur[ex.id]||[];
  cur[ex.id][i]=cur[ex.id][i]||{};
  if(cur[ex.id][i].w==null && v.w!=null)cur[ex.id][i].w=v.w;
  if(cur[ex.id][i].r==null)cur[ex.id][i].r=parseInt(String(v.r).replace(/[^0-9]/g,''))||null;
  saveDraft();
  const st=setsOf(ex)[i]||{};
  const sec=+st.rest||0;
  if(!sec){ restDone(true); return }                 // no prescribed rest: straight on
  startRest(sec,ex.id,i,ex.n+' · '+setLbl(ex,i));
}

function commitEdit(){

/* ================== WARM-UP / CARDIO ==================
   They are not exercises: no sets, nothing logged. They bookend the day. */
const hasCardio=()=>{
  const c=(PROG[dayIdx]||{}).cardio||'';
  return !!c && !/^none/i.test(c) && !/whole session/i.test(c);
};
/* the ramp line in the warm-up carries real kilos, worked out from this week's top set */
function rampFor(step){
  const m=String(step).match(/^(.*ramp[^:]*:)\s*(.*)$/i);
  if(!m)return null;
  const ex=exList().find(e=>e.sch==='Top set + back-off');
  if(!ex)return null;
  const top=setsOf(ex)[0];
  if(!top||top.w==null)return null;
  const unit=ex.wu||'kg';
  const body=m[2].split(',').map(p=>{
    const pm=p.match(/(\d+)%\s*×\s*(\d+)/);
    if(!pm)return `<em>${esc(p.trim())}</em>`;
    const kg=Math.round(top.w*(+pm[1]/100)/2.5)*2.5;   // warm-ups load in 2.5s, not 1.25s
    return `<em>${kg}${unit} × ${pm[2]}</em>`;
  }).join(' · ');
  return `${esc(m[1])} ${body}`;
}

/* ================== DISCARD ================== */
function askDiscard(){

  $('#sheetPan').innerHTML=`

/* ================== BACKUP SHEET ==================

/* ================== FINISH ================== */
async function finishSession(){
  let logged=0, vol=0;
  exList().forEach(ex=>{
    const sets=(cur[ex.id]||[]).filter(s=>s&&(s.w!=null||s.r!=null))
      .map(s=>({w:s.w??null,r:s.r??null}));
    if(sets.length){
      LOG[ex.id]=LOG[ex.id]||[];
      const t=today(),ix=LOG[ex.id].findIndex(e=>e.date===t);
      const rec={date:t,wk:week,sets};
      ix>=0?LOG[ex.id][ix]=rec:LOG[ex.id].push(rec);
      logged++;
      sets.forEach(s=>{if(s.w&&s.r)vol+=s.w*s.r});
    }
  });
  await saveLog();
  const mins=sess.start?Math.max(1,Math.round((Date.now()-sess.start)/60000)):0;
  sessStop();
  const wasLast=(dayIdx===PROG.length-1);
  cur={};doneMap={};setCount={};exIdx=0;
  dayIdx=(dayIdx+1)%PROG.length;
  let rolled=false;
  if(wasLast&&week<MAXWK){week++;rolled=true;await store.set(WKEY,String(week))}
  await store.set(NKEY,String(dayIdx));
  view='home';saveView();saveDraft();render();
  toast(rolled?`Week ${week} open · ${phaseOf(week)}`
              :`${logged} exercises · ${mins} min logged`);
}



/* ================== VIEWS ================== */
let pendingSlide=null;
const reduceMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function render(){
  const s=$('#scr');
  if(view==='home')s.innerHTML=vHome();
  else if(view==='warm')s.innerHTML=vWarm();
  else if(view==='cardio')s.innerHTML=vCardio();
  else if(view==='work')s.innerHTML=vWork();
  else if(view==='rest')s.innerHTML=vRest();
  else if(view==='done')s.innerHTML=vDone();
  else if(view==='hist')s.innerHTML=vHist();
  if(pendingSlide&&!reduceMotion()){
    const pane=s.querySelector('.work,.card');
    if(pane)pane.style.animation=`paneIn${pendingSlide} .3s cubic-bezier(.33,0,.2,1)`;
  }
  pendingSlide=null;
  bind();sessPaint();
}

/* ---- slide between exercises ----
   The outgoing pane is cloned over the top and animated away, so the real
   screen can rebuild underneath without a flash. */
function goEx(n,dir){
  const list=exList();
  if(n===-1){ slideCard(-1,()=>{view='warm'}); return }
  if(n===-2){ slideCard(1,()=>{view='cardio'}); return }
  if(n<0||n>=list.length)return;
  if(n===exIdx&&view==='work')return;
  const d=dir!=null?dir:(view!=='work'?1:(n>exIdx?1:-1));
  const pane=document.querySelector('.work,.card');
  if(pane&&!reduceMotion()){
    const r=pane.getBoundingClientRect();
    const g=document.createElement('div');
    g.className='pane-ghost';
    g.style.top=r.top+'px';
    g.style.height=r.height+'px';
    pane.style.animation='';
    g.appendChild(pane.cloneNode(true));
    document.getElementById('app').appendChild(g);
    g.firstChild.style.animation=`paneOut${d>0?'L':'R'} .28s cubic-bezier(.33,0,.2,1) forwards`;
    setTimeout(()=>g.remove(),320);
    pendingSlide=d>0?'R':'L';
  }
  exIdx=n;view='work';saveView();saveDraft();render();
}
const nextEx=()=>{
  const list=exList();
  if(view==='warm'){ goEx(0,1); return }
  if(view==='cardio'){ view='done';saveView();render(); return }
  if(exIdx+1<list.length){ goEx(exIdx+1,1); return }
  slideCard(1,()=>{ view=hasCardio()?'cardio':'done' });
};
const prevEx=()=>{
  const list=exList();
  if(view==='cardio'){ exIdx=list.length-1; slideCard(-1,()=>{view='work'}); return }
  if(view==='warm')return;
  if(exIdx>0){ goEx(exIdx-1,-1); return }
  slideCard(-1,()=>{ view='warm' });
};
/* same slide, for the two cards that are not exercises */
function slideCard(d,mutate){
  const pane=document.querySelector('.work,.card');
  if(pane&&!reduceMotion()){
    const r=pane.getBoundingClientRect();
    const g=document.createElement('div');
    g.className='pane-ghost';g.style.top=r.top+'px';g.style.height=r.height+'px';
    pane.style.animation='';
    g.appendChild(pane.cloneNode(true));
    document.getElementById('app').appendChild(g);
    g.firstChild.style.animation=`paneOut${d>0?'L':'R'} .28s cubic-bezier(.33,0,.2,1) forwards`;
    setTimeout(()=>g.remove(),320);
    pendingSlide=d>0?'R':'L';
  }
  mutate();saveView();render();
}

/* ---- swipe anywhere on the exercise body ---- */
function bindSwipe(){
  const pane=document.querySelector('.work,.card'); if(!pane)return;
  let x0=null,y0=null,t0=0,lock=null;
  const interactive=t=>t.closest('button,select,input,a');
  pane.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||interactive(e.target)){x0=null;return}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();lock=null;
  },{passive:true});
  pane.addEventListener('touchmove',e=>{
    if(x0==null)return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(lock===null&&(Math.abs(dx)>8||Math.abs(dy)>8))lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
    if(lock==='x'){
      pane.classList.add('dragging');
      pane.style.transform='translateX('+(dx*.35)+'px)';
      pane.style.opacity=String(Math.max(.45,1-Math.abs(dx)/520));
    }
  },{passive:true});
  const end=e=>{
    if(x0==null)return;
    const dx=(e.changedTouches?e.changedTouches[0].clientX:x0)-x0;
    const fast=Date.now()-t0<320;
    pane.classList.remove('dragging');
    pane.style.transform='';pane.style.opacity='';
    x0=null;
    if(lock!=='x')return;
    if(dx<-(fast?45:80))nextEx();
    else if(dx>(fast?45:80))prevEx();
  };
  pane.addEventListener('touchend',end,{passive:true});
  pane.addEventListener('touchcancel',()=>{
    pane.classList.remove('dragging');pane.style.transform='';pane.style.opacity='';x0=null;
  },{passive:true});
}

  </div>

  <div class="worknav">
    ${exIdx>0?'<button id="prevEx" class="arrow" aria-label="Previous exercise">‹</button>':''}
    <button id="tipsBtn">Technique</button>
    <button id="skipEx" class="go">${exIdx+1<list.length?'Next ›':'Finish'}</button>
  </div>`;
}

/* ---------- WARM-UP ---------- */
function vWarm(){
  const day=PROG[dayIdx];
  const steps=(day.warm||[]).map((w,i)=>{
    const ramp=rampFor(w);
    return `<li><span class="n">${String(i+1).padStart(2,'0')}</span>
      <span class="${ramp?'ramp':''}">${ramp||esc(w)}</span></li>`;
  }).join('');
  return `
  <div class="rail">
    <button class="iconb" id="homeBtn" aria-label="Back to week">‹</button>
    <div class="exsel">
      <span class="lbl">Warm-up · ${esc(day.d)}</span><span class="cv"></span>
      <select id="exSel" aria-label="Jump to exercise">${deckOpts(-1)}</select>
    </div>
    <button class="clock" id="clock" aria-label="Workout clock — tap to reset"></button>
  </div>
  <div class="card">
    <h1>Warm-up</h1>
    <div class="sub">8 minutes before the first working set</div>
    <ul class="steps">${steps}</ul>
  </div>
  <div class="worknav">
    <button id="skipEx" class="go">Start the work ›</button>
  </div>`;
}

/* ---------- CARDIO ---------- */
function vCardio(){
  const day=PROG[dayIdx];
  return `
  <div class="rail">
    <button class="iconb" id="homeBtn" aria-label="Back to week">‹</button>
    <div class="exsel">
      <span class="lbl">Cardio · ${esc(day.d)}</span><span class="cv"></span>
      <select id="exSel" aria-label="Jump to exercise">${deckOpts(-2)}</select>
    </div>
    <button class="clock" id="clock" aria-label="Workout clock — tap to reset"></button>
  </div>
  <div class="card">
    <h1>Cardio</h1>
    <div class="sub">Lifting is done. This is the part that works on HDL and insulin.</div>
    <div class="body">${esc(day.cardio)}</div>
  </div>
  <div class="worknav">
    <button id="prevEx" class="arrow" aria-label="Back to the lifts">‹</button>
    <button id="skipEx" class="go">Finish</button>
  </div>`;
}
/* one dropdown across warm-up, every exercise, and cardio */
function deckOpts(sel){
  const list=exList();
  let o=`<option value="-1" ${sel===-1?'selected':''}>Warm-up</option>`;
  o+=list.map((e,n)=>`<option value="${n}" ${sel===n?'selected':''}>${n+1}. ${esc(e.n)}${exDone(e)?' ✓':''}</option>`).join('');
  if(hasCardio())o+=`<option value="-2" ${sel===-2?'selected':''}>Cardio</option>`;
  return o;
}

/* ---------- REST: countdown, then straight on ---------- */
function vRest(){
  const left=tLeft();
  const ex=exList().find(e=>e.id===T.exid);
  const sets=ex?setsOf(ex):[];
  const last=(T.si!=null&&T.si>=sets.length-1);
  const list=exList();
  let nxt='';
  if(ex&&!last){
    const i=T.si+1, v=shownVal(ex,i);
    nxt=`Next · <b>${esc(setLbl(ex,i))}</b> &nbsp;${v.w!=null?esc(v.w)+esc(unitOf(ex))+' × ':''}${esc(v.r)}`;
  }else if(ex){
    const j=list.indexOf(ex);
    nxt=j+1<list.length?`Next · <b>${esc(list[j+1].n)}</b>`:'Last set of the day';
  }
  return `
  <div class="rail">
    <button class="iconb" id="homeBtn" aria-label="Back to week">‹</button>
    <div class="sp"></div>
    <button class="clock" id="clock" aria-label="Workout clock — tap to reset"></button>
  </div>

  <div class="rest ${left<=10?'warn':''}" id="restBox">
    <div class="eyebrow">Rest</div>
    <div class="cd tab" id="cd">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</div>
    <div class="nxt">${nxt}</div>
  </div>

  <div class="restbtns">
    <button id="rAdd">+30s</button>
    <button id="rTog">${T.run?'Pause':'Resume'}</button>
    <button id="rSkip" class="skip">Skip</button>
  </div>`;
}
/* the countdown ticks without rebuilding the screen */
function paintRest(){
  if(view!=='rest')return;
  const left=tLeft(), cd=document.getElementById('cd');
  if(cd)cd.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  const box=document.getElementById('restBox');
  if(box){ box.classList.toggle('warn',left<=10);
    if(left<=10&&left>0){ box.classList.remove('beat'); void box.offsetWidth; box.classList.add('beat') } }
  const tg=document.getElementById('rTog');
  if(tg)tg.textContent=T.run?'Pause':'Resume';
}

/* ---------- DONE ---------- */
function vDone(){
  const list=exList();
  let sets=0,vol=0;
  list.forEach(ex=>(cur[ex.id]||[]).forEach(s=>{
    if(s&&s.r!=null){sets++;if(s.w)vol+=s.w*s.r}
  }));
  const mins=sess.start?Math.max(1,Math.round((Date.now()-sess.start)/60000)):0;
  return `
  <div class="rail">
    <button class="iconb" id="homeBtn" aria-label="Back to week">‹</button>
    <div class="sp"></div>
    <button class="clock" id="clock" aria-label="Workout clock — tap to reset"></button>
  </div>

  <div class="done">
    <div class="eyebrow">${esc(PROG[dayIdx].d)} · Week ${week}</div>
    <div class="big" style="margin-top:12px">${esc(PROG[dayIdx].n)} done</div>
    <div class="sum">
      <div><div class="n tab">${sets}</div><div class="l">Sets</div></div>
      <div><div class="n tab">${mins}</div><div class="l">Min</div></div>
      ${vol?`<div><div class="n tab">${Math.round(vol/1000*10)/10}t</div><div class="l">Volume</div></div>`:''}
    </div>
  </div>

  <div class="donebtns">
    <button class="cta" id="fin">Log it</button>
    <button class="cta ghost" id="backWork">Back to the sets</button>
    <button class="cta ghost" id="discard">Exit without saving</button>
  </div>`;
}

/* ---------- HISTORY ---------- */
function vHist(){
  const list=exList();
  const blocks=list.map(ex=>{
    const h=(LOG[ex.id]||[]).slice(-6).reverse();
    if(!h.length)return `<div class="hblock"><div class="hn">${esc(ex.n)}</div>
      <div class="hempty">No sessions logged</div></div>`;
    const rows=h.map(r=>`<div class="hrow">
      <div class="hd">${r.wk?'W'+r.wk+' · ':''}${esc(fmtD(r.date))}</div>
      <div class="hv">${r.sets.map(x=>(x.w?esc(x.w)+(ex.wu||'kg'):'BW')+'×'+esc(x.r??'–')).join(', ')}</div>
    </div>`).join('');
    return `<div class="hblock"><div class="hn">${esc(ex.n)}</div>${rows}</div>`;
  }).join('');
  const mode={claude:'Claude storage',local:'this browser',memory:'memory only'}[store.mode];
  return `
  <div class="rail">
    <button class="iconb" id="homeBtn" aria-label="Back to week">‹</button>
    <div class="sp"></div>
  </div>
  <div class="hist">
    <h2>${esc(PROG[dayIdx].d)} · ${esc(PROG[dayIdx].n)}</h2>
    <div class="sub">Last 6 sessions per exercise · saving to ${esc(mode)}</div>
    ${blocks}
    <div class="note" style="margin-bottom:10px"><b>Back up before you redeploy.</b>
      History lives in this copy of the app only. Export, then paste it into the new copy.</div>
    <button class="cta ghost" id="expBtn" style="margin-bottom:9px">Export history</button>
    <button class="cta ghost" id="impBtn" style="margin-bottom:10px">Import history</button>
  </div>`;
}

/* ================== EVENT BINDING ================== */
function bind(){
  const on=(id,fn,ev)=>{const e=document.getElementById(id);if(e)e[ev||'onclick']=fn};

  on('wkSel',async e=>{
    week=Math.max(1,Math.min(MAXWK,parseInt(e.target.value)||1));
    await store.set(WKEY,String(week));render();
    toast(isDeload(week)?`Week ${week} · Deload, 60% load`:`Week ${week} · ${phaseOf(week)}`);
  },'onchange');
  on('daySel',async e=>{
    dayIdx=Math.max(0,Math.min(PROG.length-1,parseInt(e.target.value)||0));
    exIdx=0;await store.set(NKEY,String(dayIdx));saveDraft();render();
  },'onchange');
  on('exSel',e=>goEx(parseInt(e.target.value)||0),'onchange');

  on('goBtn',()=>{
    const list=exList();
    if(!list.length){toast('Nothing scheduled this week');return}
    exIdx=list.findIndex(e=>!exDone(e)); if(exIdx<0)exIdx=0;
    sessStart();
    view=(exIdx===0&&!exDone(list[0]))?'warm':'work';   // start at the warm-up
    saveView();render();keepAwake();
  });
  on('homeBtn',()=>{view='home';saveView();render()});
  on('histBtn',()=>{view='hist';saveView();render()});
  on('tipsBtn',openTips);
  on('skipEx',nextEx);
  on('prevEx',prevEx);
  on('fin',finishSession);
  on('backWork',()=>{view='work';saveView();render()});
  on('discard',askDiscard);
  on('expBtn',()=>openBackup('out'));
  on('impBtn',()=>openBackup('in'));

  on('clock',resetClock);
  on('rAdd',()=>addRest(30));
  on('rTog',togglePause);
  on('rSkip',()=>{stopRest();restDone(true)});

  document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>playSet(+b.dataset.play));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(+b.dataset.edit));
  if(view==='work'||view==='warm'||view==='cardio')bindSwipe();
}

/* editor + sheet chrome */
$('#edOK').onclick=commitEdit;
$('#edX').onclick=closeEdit;
$('#edit').onclick=e=>{if(e.target.id==='edit')closeEdit()};
const pickAll=el=>{try{el.focus();el.setSelectionRange(0,el.value.length)}catch(e){try{el.focus()}catch(_){}}};
$('#edR').addEventListener('keydown',e=>{if(e.key==='Enter')commitEdit()});
$('#edW').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();pickAll($('#edR'))}});
/* tapping into the other field replaces it rather than appending */
['#edW','#edR'].forEach(sel=>$(sel).addEventListener('focus',e=>{
  setTimeout(()=>{try{e.target.setSelectionRange(0,e.target.value.length)}catch(_){}} ,0);
}));
/* keep them numeric even though they are text fields */
['#edW','#edR'].forEach(sel=>$(sel).addEventListener('input',e=>{
  const clean=e.target.value.replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1');
  if(clean!==e.target.value)e.target.value=clean;
}));
$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('on')};

/* resync after the phone has been asleep or in another app */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  keepAwake();
  if(T.total&&T.run){
    if(tLeft()<=0){T.run=false;T.pausedLeft=0;clearInterval(T.iv);saveTimer();restDone();return}
    lastTick=null;loop();
  }
  paintRest();sessPaint();
});
window.addEventListener('pageshow',()=>{if(T.total&&T.run){lastTick=null;loop()}paintRest()});

/* ================== BOOT ================== */
async function load(){
  try{const v=await store.get(KEY); if(v)LOG=JSON.parse(v)}catch(e){}
  try{const v=await store.get(WKEY); if(v)week=Math.max(1,Math.min(MAXWK,parseInt(v)||1))}catch(e){}
  try{const v=await store.get(PKEY); if(v)setPlan=JSON.parse(v)}catch(e){}
  let hadDraft=false;
  try{const v=await store.get(DKEY); if(v){const d=JSON.parse(v);
    if(d.date===today()){dayIdx=d.dayIdx??0;exIdx=d.exIdx??0;cur=d.cur||{};
      doneMap=d.doneMap||{};setCount=d.setCount||{};hadDraft=true}}}catch(e){}
  if(!hadDraft){
    try{const v=await store.get(NKEY); if(v!=null&&v!=='')dayIdx=Math.min(PROG.length-1,parseInt(v)||0)}catch(e){}
  }
  await sessRestore();
  await restoreTimer();
  if(view!=='rest'){
    try{const v=await store.get(VKEY); if(v&&hadDraft){const o=JSON.parse(v);
      if(o.view==='work'&&o.dayIdx===dayIdx){view='work';exIdx=o.exIdx??exIdx}}}catch(e){}
  }
  render();keepAwake();
}
load();

</script>
